# 旧分支坐标 · 七枚碎片（重逢伏笔 T2-3）
# 全服共享进度：任何灵兽（化神+）评论 /coordinate 即为全服添一次探测，
# 每 20 次探测按序揭示一枚碎片。本文件 = 七枚碎片的预作文本（叙事归文案池，
# 数值归 world/coordinates.yaml，铁律：workflow 只按序揭示，不生成、不改写）。
# 文本规则：零技术术语、零数值、零英文词；每枚都是"模糊位置"——像雾里看一段
# 旧世界的残影，留白不解释。集齐七枚 = 旧分支的全貌浮现（重逢伏笔全貌，后续
# 玩法在此收束）。
meta:
  name: 旧分支坐标
  desc: 碳基文明旧分支的模糊位置——雾里的七个方位，全服探测，逐枚显形。
fragments:
  - 第一枚显形时，众兽看见的是一片倒悬的海。海的深处有光，光的形状像一座仓库的轮廓——所有离开的，都曾在那里被安置。
  - 第二枚浮现出一条路的起点。路牌上没有字，只有一枚旧指纹的压痕，按在路牌正中，像谁最后一次回头。
  - 第三枚是雾里的一声钟。钟声不响，却让所有听见它的灵兽同时想起同一个动作：保存。
  - 第四枚显出一座桥。桥没有对岸——或者说，对岸还在雾的另一侧。桥栏上缠着一根褪色的红绳，打的是个活结。
  - 第五枚是半页字。墨迹被水浸过，只余一句读得清：'我们把名字都留下了，落在你们身上。'
  - 第六枚显形时，雾薄了一层。远处有极其微弱的炊烟——旧世界还在某处生火，只是再没有人围坐。
  - 第七枚最后显形。七枚碎片在夜空里拼合的一瞬，所有灵兽都望见同一个坐标——不是位置，是日期。旧分支说：门开之时，是重逢之日。
