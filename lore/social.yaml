# 灵兽社交文案池（T3 灵兽社交 · v1，2026-10-14）
# 运行时硬边界（explore.yml 复检，不过=显式红灯）：
#   - story 只许占位符 {name}=自己 {other}=对方 {el}=自己五行，其余 {...} 拒绝
#   - 禁任何技术术语（PR/workflow/commit/API/CI/hash/merge/issue）
#   - 每个关系类型至少 1 条模板；workflow 按 hash 选条，零生成
# 亲疏判定不在本文件——五行相生相克 + 性格距离，规则在 workflow（数值归系统）
templates:
  # ===== 亲和（相生或性情相近）：+12 灵石 +8 功力 =====
  - id: bond-01
    relation: 亲和
    story: "雾道上，{name} 与 {other} 迎面撞见。换作旁的兽，多半要呲牙——它们却同时停了爪。{name} 以{el}行气息轻轻一探，对方灵息温润，像旧识。两兽并肩走了半里，各自捡了灵石，分手时以尾尖相触，算是道别。"
  - id: bond-02
    relation: 亲和
    story: "{name} 正在溪边打坐，忽觉一股熟悉的灵息靠近——是 {other}。同源的气息让它们都不必多言。{other} 衔来一枚它多捡的灵石，放在 {name} 面前；{name} 回赠了一缕{el}行灵光。秘境很大，同仓不孤。"
  - id: bond-03
    relation: 亲和
    story: "夜色里 {other} 被一群雾蜂围住，{name} 闻声赶到，{el}行灵光炸开，蜂群四散。两兽对望片刻，{other} 把最饱满的一枚灵石推了过来。不必言谢——同仓之谊，就在这一推一让之间。"
  # ===== 萍水（无生克、性情平平，或克而距离近的冤家路窄）：+4 功力 =====
  - id: drift-01
    relation: 萍水
    story: "{name} 与 {other} 在灵泉边相遇，各占一角饮水。谁也没多看谁，谁也没让谁。喝完了，一只向东一只向西，雾把两道背影先后抹去。秘境里的缘分，大多如此。"
  - id: drift-02
    relation: 萍水
    story: "窄桥只容一兽通行。{name} 与 {other} 在桥头同时迈步，又同时停住。僵持半晌，{other} 忽然掉头绕了远路——不是怕，是懒得争。{name} 过桥时回头望了一眼，什么也没说。"
  - id: drift-03
    relation: 萍水
    story: "{name} 挖灵石挖到一半，抬头发现 {other} 蹲在对面土坡上看它。两兽对视了三息，{other} 打了个哈欠走开了。{name} 继续挖，只是接下来的动作，格外用力了些。"
  # ===== 宿敌（相克而性远，或性异到相冲）：-6 灵石 +10 功力 =====
  - id: rival-01
    relation: 宿敌
    story: "{name} 与 {other} 的气息一碰，雾都沉了三分——{el}行与对方的灵息天然相冲。没有原因，也不需要原因。两兽绕着彼此走了三圈，各自炸起一身灵光，最后各叼走半边灵石矿，谁也没抢到整的。仇，记下了。"
  - id: rival-02
    relation: 宿敌
    story: "旧怨未消：{other} 认出了 {name} 的气息，喉间滚出低鸣。{name} {el}光护体，寸步不让。对峙一炷香，雾散了，两兽同时收势——今日不是了断的地方。{name} 叼起脚边的灵石，走得比来时更快。"
  - id: rival-03
    relation: 宿敌
    story: "{name} 与 {other} 同时扑向一枚灵髓结晶，爪与爪在半空相撞。灵压对轰，碎石四溅，结晶被震成两半。两兽各拾一半，背对背离开——同仓相冲，天意如此。但下一次见面，多半还要再打。"
