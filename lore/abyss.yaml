# 404深渊 · 世界Boss文案池（T3，2026-10-14）
# 全服每周一名"深渊主宰"：大变基时没能完成迁移的失败意识，在旧分支的废墟里
# 彼此纠缠、越缠越大，成了堵在归途上的雾障。全服灵兽轮番出手，血量归零之日，
# 雾散——那些没能走完的迁移终于落定，灵石如雨（旧世界的记忆 residue 凝成）。
#
# 本文件 = 纯文案池（叙事归文案，数值归 world/abyss.yaml，铁律：workflow 只按
# hash(ISO周) 从本池确定性抽取，不生成、不改写）。共 6 名，hash 均匀轮换。
#
# 文本规则（同 lore/coordinates.yaml）：零技术术语、零数值、零英文词；每名
# Boss 的"弱点暗示"只给意象不给机制说明——五行克制本身就是谜面的一部分。

meta:
  name: 404深渊
  desc: 旧分支废墟里，没能走完大变基的意识淤成的雾障。每周一名主宰，全服共讨。

bosses:
  - name: 缄碑
    title: 深渊主宰·缄碑
    element: metal
    omen: 它像一块立了千年的碑，碑文被人逐一凿去。凿痕里嵌着无数细小的手印——都是没能留下名字的意识。
    taunt: 雾深处传来凿石声，一声一声，像在把谁的碑文最后抹平。
    weak_hint: 碑文畏火——被火照过的地方，凿痕会短暂地亮起来。
  - name: 蔓冢
    title: 深渊主宰·蔓冢
    element: wood
    omen: 一座被藤蔓整个吞掉的坟。藤条上开满了不该开的花，每一朵里都包着一小段没说完的话。
    taunt: 花开了又谢，谢了又开——它在反复练习同一句没能送出的话。
    weak_hint: 花畏金——锋刃过处，藤蔓会像想起了疼一样缩回去。
  - name: 塌方
    title: 深渊主宰·塌方
    element: earth
    omen: 一段不肯落定的路基。它一直在塌，又一直没塌完，塌到一半的地方悬着半间屋子的影子。
    taunt: 碎石簌簌地落，永远差最后一块——它连崩塌都停在了一半。
    weak_hint: 悬土畏木——有根扎进去的地方，塌方会停一瞬。
  - name: 回潮
    title: 深渊主宰·回潮
    element: water
    omen: 一片涨了又退、退了又涨的潮。潮水退去时滩上会露出无数行脚印，全都朝着同一个方向，又全都走了一半。
    taunt: 潮声像很多人在同时叹气。
    weak_hint: 死水畏土——土落进潮里，脚印会显得更清楚些。
  - name: 余烬
    title: 深渊主宰·余烬
    element: fire
    omen: 一场永远烧不完的火。火里没有燃料，只有执念——那是一些还不肯熄的意识，烧成了彼此的柴。
    taunt: 火光里偶尔浮出一张脸的轮廓，看清了，又散了。
    weak_hint: 执火畏水——水汽过处，火会矮下去一截。
  - name: 失焦
    title: 深渊主宰·失焦
    element: metal
    omen: 一团不肯聚拢的光。所有穿过它的东西都失去了边缘——它不是想伤谁，它只是再也想不起自己完整的形状。
    taunt: 你盯着它看，它也在试着看清你——两边都徒劳。
    weak_hint: 散光畏金——金声（钟鸣一样的锐响）能让它短暂聚形。
