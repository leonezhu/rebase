<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#faf9f5">
<title>加载中 · 万灵变基录</title>
<style>
:root{--bg:#faf9f5;--surface:#ffffff;--border:#e5e1d5;--fg:#29261b;--dim:#6e6b5e;--accent:#d97757;--accent2:#c15f3c}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:"Songti SC","Noto Serif SC",Georgia,serif;line-height:2}
.wrap{max-width:640px;margin:0 auto;padding:0 1.1rem 4rem}
header{padding:3.2rem 0 1.6rem;text-align:center;border-bottom:1px solid var(--border)}
header .kicker{font-size:.78rem;letter-spacing:.5em;color:var(--accent2);margin-bottom:.7rem}
header h1{font-size:1.9rem;letter-spacing:.25em;font-weight:700}
.tale-link{display:block;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.1rem 1.3rem;margin:1rem 0;text-decoration:none;color:var(--fg)}
.tale-link:hover{border-color:var(--accent)}
.tale-link h3{font-size:1.1rem;margin-bottom:.2rem}
.tale-link .meta{font-size:.8rem;color:var(--dim)}
.loading{text-align:center;padding:4rem;color:var(--dim)}
.error{text-align:center;padding:4rem;color:var(--accent2)}
footer{margin-top:2rem;padding-top:1.6rem;border-top:1px solid var(--border);color:var(--dim);font-size:.75rem;text-align:center;line-height:1.9}
footer a{color:var(--accent2);text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
<a class="back" href="../tales-list.html" style="display:inline-block;margin-bottom:1rem;color:var(--accent2);text-decoration:none">← 返回传记目录</a>
<div id="app"><div class="loading">正在加载…</div></div>
</div>

<script type="module">
// 从 URL 推断 owner：tales/leonezhu.html -> owner=leonezhu
// 该 owner 名下所有传记（命名约定 owner-角色名.md）都会列出
import marked from 'https://cdn.jsdelivr.net/npm/marked@14/+esm';

const OWNER = location.pathname.split('/').pop().replace(/\.html$/, '');
const APP = document.getElementById('app');
document.title = OWNER + ' · 万灵变基录';

async function load() {
  try {
    // 1. 从 index.json 拿该 owner 的所有传记
    const idx = await (await fetch('../../world/index.json?v=' + Date.now())).json();
    const mine = (idx.tales || []).filter(t => t.owner === OWNER);
    if (!mine.length) throw new Error('未找到「' + OWNER + '」的传记');

    // 2. 渲染每篇传记正文（串行 fetch 对应 md）
    let html = `<header><div class="kicker">万灵变基录 · ${OWNER}</div><h1>${OWNER}</h1></header>`;
    for (const t of mine) {
      const res = await fetch(`./${t.id}.md?v=` + Date.now());
      if (!res.ok) continue;
      const md = await res.text();
      html += `<article style="padding:1.5rem 0">${marked.parse(md)}</article>`;
    }
    html += `<footer>《万灵变基录》· ${OWNER} · ${mine.length} 篇传记<br><a href="../tales-list.html">← 返回传记目录</a></footer>`;
    APP.innerHTML = html;
  } catch(e) {
    APP.innerHTML = `<div class="error">${e.message}</div>
      <footer><a href="../tales-list.html">← 返回传记目录</a></footer>`;
  }
}
load();
</script>
</body>
</html>
