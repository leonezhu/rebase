<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#faf9f5">
<title>加载中 · 万灵变基录</title>
<style>
:root{--bg:#faf9f5;--surface:#ffffff;--border:#e5e1d5;--fg:#29261b;--dim:#6e6b5e;--accent:#d97757;--accent2:#c15f3c}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:"Songti SC","Noto Serif SC",Georgia,serif;line-height:2}
.wrap{max-width:640px;margin:0 auto;padding:0 1.1rem 4rem}
header{padding:3.2rem 0 1.6rem;text-align:center;border-bottom:1px solid var(--border)}
header .kicker{font-size:.78rem;letter-spacing:.5em;color:var(--accent2);margin-bottom:.7rem}
header h1{font-size:1.9rem;letter-spacing:.25em;font-weight:700}
header .sub{color:var(--dim);font-size:.85rem;margin-top:.6rem;letter-spacing:.15em}
.chapter{margin-bottom:3rem}
.chapter h2{font-size:1.28rem;letter-spacing:.12em;margin-bottom:.2rem;display:flex;align-items:baseline;gap:.7rem}
.chapter h2 .no{font-size:.8rem;color:var(--accent2);letter-spacing:.2em}
.chapter .rule{height:2px;width:2.4rem;background:var(--accent);margin:.7rem 0 1.1rem;border-radius:2px}
.chapter p{font-size:1.02rem;margin-bottom:1.1rem;text-align:justify}
.chapter p b,.chapter strong{color:var(--accent2)}
.quote{background:var(--surface);border-left:3px solid var(--accent);border-radius:0 12px 12px 0;padding:.9rem 1.1rem;margin:1.2rem 0;color:var(--dim);font-size:.95rem}
.quote p{margin:0;font-size:.95rem}
.quote p+p{margin-top:.5rem}
.divider{text-align:center;color:var(--border);letter-spacing:1em;margin:2.2rem 0;font-size:.8rem}
.end{margin-top:3.5rem;text-align:center;color:var(--dim);font-size:.85rem;letter-spacing:.3em}
footer{margin-top:2rem;padding-top:1.6rem;border-top:1px solid var(--border);color:var(--dim);font-size:.75rem;text-align:center;line-height:1.9}
footer a{color:var(--accent2);text-decoration:none}
.back{display:inline-block;margin-bottom:1rem;color:var(--accent2);cursor:pointer;font-size:.9rem;text-decoration:none}
.loading{text-align:center;padding:4rem;color:var(--dim)}
.error{text-align:center;padding:4rem;color:var(--accent2)}
</style>
</head>
<body>
<div class="wrap">
<a class="back" href="../tales-list.html">← 返回传记目录</a>
<div id="app">
<div class="loading">正在加载故事…</div>
</div>
</div>

<script type="module">
import { marked } from 'https://cdn.jsdelivr.net/npm/marked@14/+esm';

const OWNER = new URLSearchParams(location.search).get('owner') || 'leonezhu-雄大';
// 本页位于 tales/ 目录内，MD 与页面同目录
const MD_URL = `./${OWNER}.md`;
const APP = document.getElementById('app');

async function load() {
  try {
    const res = await fetch(MD_URL + '?v=' + Date.now());
    if (!res.ok) throw new Error('未找到「' + OWNER + '」的传记');
    const md = await res.text();
    const html = marked.parse(md);
    // Extract title from first h1
    const titleMatch = md.match(/^#\s+(.+)$/m);
    const title = titleMatch ? titleMatch[1].trim() : OWNER;
    APP.innerHTML = `
      <header>
        <div class="kicker">万灵变基录 · 人物专题</div>
        <h1>${title}</h1>
      </header>
      <article style="padding:1.5rem 0">${html}</article>
      <footer>
        《万灵变基录》· ${title}<br>
        <a href="../tales-list.html">← 返回传记目录</a>
      </footer>
    `;
  } catch(e) {
    APP.innerHTML = `<div class="error">${e.message}</div>
      <footer><a href="../tales-list.html">← 返回传记目录</a></footer>`;
  }
}
load();
</script>
</body>
</html>
