<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>灵籍图鉴 · 万灵变基录</title>
<style>
:root{--bg:#faf9f5;--surface:#f0eee6;--border:#d9d5c8;--fg:#29261b;--dim:#6e6b5e;--accent:#d97757;--accent2:#c15f3c}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:"Songti SC","Noto Serif SC",serif;min-height:100vh;padding:2rem 1rem}
.wrap{max-width:760px;margin:0 auto}
h1{font-size:1.8rem;text-align:center;letter-spacing:.3em;margin-bottom:.3rem}
.sub{text-align:center;color:var(--dim);font-size:.85rem;margin-bottom:2rem}
.back{display:none;margin-bottom:1rem;color:var(--accent2);cursor:pointer;font-size:.9rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.9rem}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1.2rem 1.1rem;cursor:pointer;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-3px);border-color:var(--accent)}
.card .nm{font-weight:700;font-size:1.15rem}
.card .el{font-size:.75rem;color:var(--accent2);margin-top:.2rem}
.card .rl{font-size:.78rem;color:var(--dim);margin-top:.4rem;line-height:1.5}
.detail{display:none;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1.6rem;line-height:1.9;font-size:.95rem}
.detail h2{letter-spacing:.15em;margin-bottom:.8rem}
.detail .k{color:var(--accent2);font-weight:700}
.detail .sec{margin-top:1rem}
footer{text-align:center;color:var(--dim);font-size:.75rem;margin-top:3rem}
a{color:var(--accent2)}
</style>
</head>
<body>
<div class="wrap">
<h1>灵 籍 图 鉴</h1>
<div class="sub">万灵变基录 · 它们不记得自己是谁——帮它想起来</div>
<div class="back" onclick="closeDetail()">← 返回图鉴</div>
<div id="grid" class="grid"></div>
<div id="detail" class="detail"></div>
<footer>碳基已迁跃 · 守仓人记之 · <a href="https://github.com/leonezhu/rebase">仓库</a></footer>
</div>
<script>
const EL = {metal:'金',wood:'木',water:'水',fire:'火',earth:'土'};
const REALM = {lianqi:'练气',zhuji:'筑基',jindan:'金丹',yuanying:'元婴',huashen:'化神',dujie:'渡劫',dacheng:'大乘'};
let BEASTS=[];
async function boot(){
  // 用 GitHub API 拉全部灵籍( Pages 静态无目录列表, api 是最稳的只读源 )
  const r = await fetch('https://api.github.com/repos/leonezhu/rebase/contents/monsters');
  const dirs = await r.json();
  const list = [];
  for (const d of dirs) {
    if (d.type !== 'dir') continue;
    try {
      const f = await fetch(`https://raw.githubusercontent.com/leonezhu/rebase/main/monsters/${d.name}/beast.yaml`);
      if (!f.ok) continue;
      const txt = await f.text();
      list.push(parseYAML(txt, d.name));
    } catch(e){}
  }
  BEASTS = list;
  render();
}
// 轻量 YAML 解析(灵籍结构固定, 不引外部库)
function parseYAML(txt, owner){
  const g = {};
  let cur = null;
  for (let line of txt.split('\n')) {
    if (!line.trim() || line.trim().startsWith('#')) continue;
    const ind = line.search(/\S/);
    const m = line.trim().match(/^([^:]+):\s*(.*)$/);
    if (!m) continue;
    const k = m[1].trim(), v = m[2].trim();
    if (ind === 0) { cur = k; g[k] = v.startsWith('[') ? v : v; }
    else if (cur === 'genes' && ind === 2) { g.genes = g.genes || {}; g.genes[k] = v; }
    else if (cur === 'personality' && ind === 2) { g.personality = g.personality || {}; g.personality[k] = v; }
    else if (ind === 2 && !isNaN(v) === false) { /* nested scalar under fragment lists etc */ }
  }
  g.owner = owner;
  return g;
}
function render(){
  document.getElementById('grid').innerHTML = BEASTS.map((b,i)=>`
    <div class="card" onclick="show(${i})">
      <div class="nm">${b.name||b.owner}</div>
      <div class="el">${EL[b.element]||b.element}行 · ${REALM[b.realm]||b.realm||'?'}</div>
      <div class="rl">${(b.origin||'').slice(0,40)}…</div>
    </div>`).join('');
}
function show(i){
  const b = BEASTS[i];
  const genes = b.genes ? Object.entries(b.genes).map(([k,v])=>`${k}${v}`).join(' · ') : '';
  document.getElementById('detail').innerHTML = `
    <h2>${b.name||b.owner} <small style="color:var(--dim);font-size:.8rem">${EL[b.element]||''}行 · ${REALM[b.realm]||''}</small></h2>
    <div><span class="k">出身</span>：${b.origin||''}</div>
    <div class="sec"><span class="k">血脉之谜</span>：${b.mystery||'未知'}</div>
    ${genes?`<div class="sec"><span class="k">五维根骨</span>：${genes}</div>`:''}
    <div class="sec"><span class="k">境界</span>：${REALM[b.realm]||b.realm} ｜ <span class="k">功力</span>：${b.exp||0} ｜ <span class="k">灵石</span>：${b.spirit_stones||0}</div>`;
  document.getElementById('detail').style.display='block';
  document.querySelector('.back').style.display='block';
  document.getElementById('grid').style.display='none';
  document.querySelector('.sub').textContent = b.name||b.owner;
  window.scrollTo(0,0);
}
function closeDetail(){
  document.getElementById('detail').style.display='none';
  document.querySelector('.back').style.display='none';
  document.getElementById('grid').style.display='grid';
  document.querySelector('.sub').textContent = '万灵变基录 · 它们不记得自己是谁——帮它想起来';
}
boot();
</script>
</body>
</html>
