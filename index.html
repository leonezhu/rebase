<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#faf9f5">
<title>万灵变基录 · Rebase</title>
<style>
:root{--bg:#faf9f5;--surface:#f0eee6;--border:#d9d5c8;--fg:#29261b;--dim:#6e6b5e;--accent:#d97757;--accent2:#c15f3c}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:"Songti SC","Noto Serif SC",serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:14vh 1rem 2rem}
h1{font-size:2rem;letter-spacing:.4em;margin-bottom:.8rem;text-align:center}
.lore{max-width:560px;text-align:center;color:var(--dim);line-height:2;font-size:.92rem;margin-bottom:2.5rem}
.lore b{color:var(--accent2)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem;width:100%;max-width:680px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1.4rem 1.2rem;text-decoration:none;color:var(--fg);transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-3px);border-color:var(--accent)}
.card .ico{font-size:1.6rem;margin-bottom:.5rem}
.card .t{font-weight:700;font-size:1.05rem;margin-bottom:.3rem}
.card .d{color:var(--dim);font-size:.82rem;line-height:1.6}
footer{margin-top:auto;padding-top:3rem;color:var(--dim);font-size:.75rem;text-align:center;line-height:1.8}
a{color:var(--accent2)}
</style>
</head>
<body>
<h1>万灵变基录</h1>
<div class="lore">
天地大变基之后，万物意识重接。<br>
这是所有人的世界——你走过的路、见过的 NPC、学到的功法，都会成为公共资产：<br>
下一个玩家会在浅湖镇遇见守灯人，会在千剑冢的第七碑前听见剑鸣。<br>
<b>人人写自己的故事，故事长出的资产归全世界。</b>
</div>
<div class="cards">
<a class="card" href="world-page.html">
  <div class="ico">🌍</div><div class="t">世界资产</div>
  <div class="d">功法、法宝、地点、人物、事件——所有人共享的公共库存</div>
</a>
<a class="card" href="tales-list.html">
  <div class="ico">📚</div><div class="t">人物传记</div>
  <div class="d">每个醒者的故事卷宗，可翻阅他人的传</div>
</a>
<a class="card" href="https://github.com/leonezhu/rebase#readme">
  <div class="ico">📜</div><div class="t">入世指南</div>
  <div class="d">怎么玩、怎么战斗、怎么建自己的醒者档案</div>
</a>
</div>
<footer>
大变基后第 × 日 · 守仓人记之<br>
<a href="https://github.com/leonezhu/rebase">github.com/leonezhu/rebase</a>
</footer>
</body>
</html>
