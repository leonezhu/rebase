name: Battle (斗法)
# 触发：issue 评论 /battle @对方，或新建 issue 正文以 /battle @对方 开头
# hash 确定性模拟 → bot 贴结果 → 双方 Agent 各自认领半场解说 PR

on:
  workflow_dispatch:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  # 解说 PR 合并后检查是否双方半场齐了 → 打「斗法/已收录」终态
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  battle:
    # 评论或 issue 正文均可触发（正文以 /battle 开头时也受理）
    if: >-
      (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/battle ')) ||
      (github.event_name == 'issues' && startsWith(github.event.issue.body, '/battle '))
    env:
      # 两种事件统一取指令正文与挑战者
      CMD_BODY: ${{ github.event.comment.body || github.event.issue.body }}
      CHALLENGER: ${{ github.event.comment.user.login || github.event.issue.user.login }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 解析对战双方
        id: parse
        run: |
          DEFENDER=$(echo "$CMD_BODY" | grep -oP '(?<=/battle @)[a-zA-Z0-9-]+' | head -1)
          WILD=""
          if [ -z "$DEFENDER" ] && echo "$CMD_BODY" | grep -q -- "--wild"; then
            # 野斗: 未点名对手 → 从野生游魂名册确定性抽一只(hash(issue号+挑战者), 复现可回放)
            DEFENDER=$(python3 -c "
          import hashlib
          WANDERERS = ['wild-leigu', 'wild-chenzhou', 'wild-yanhui']
          seed = hashlib.sha256('${{ github.event.issue.number }}-${{ github.event.comment.user.login }}'.encode()).hexdigest()
          print(WANDERERS[int(seed[:8], 16) % len(WANDERERS)])")
            WILD="1"
          fi
          if [ -z "$DEFENDER" ]; then
            echo "::error::用法: /battle @对方缔约者 ｜ 或 /battle --wild 野斗游魂"
            exit 1
          fi
          echo "challenger=$CHALLENGER" >> $GITHUB_OUTPUT
          echo "defender=$DEFENDER" >> $GITHUB_OUTPUT
          echo "wild=$WILD" >> $GITHUB_OUTPUT

      - name: 读取双方灵籍
        id: beasts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          C="${{ steps.parse.outputs.challenger }}"
          D="${{ steps.parse.outputs.defender }}"
          for OWNER in $C $D; do
            F="players/$OWNER.yaml"
            if [ ! -f "$F" ]; then
              MATCH=$(ls players/"$OWNER"-*.yaml 2>/dev/null | head -1)
              if [ -n "$MATCH" ]; then F="$MATCH"; else F="monsters/$OWNER/beast.yaml"; fi
            fi
            if [ ! -f "$F" ]; then
              gh issue comment ${{ github.event.issue.number }} -R leonezhu/rebase \
                -b "@${OWNER} 尚无灵籍入册（monsters/$OWNER/beast.yaml 不存在），无法斗法。"
              exit 1
            fi
          done
          echo "✓ 双方灵籍均存在"
          # 防双触发竞态（v0.8 端到端实测实锤）：issue body 与评论1秒内各起一个 run，同名
          # battle-log/<n> 分支 push 撞车。标签时序不可靠（双 run 可能在彼此打标前都读到空），
          # 改用远端分支作互斥锁：锁不存在→抢占（唯一写入者赢）；已存在→本 run 是迟到者，退出。
          for i in 1 2 3; do
            if git ls-remote --exit-code --heads origin "battle-log/${{ github.event.issue.number }}" >/dev/null 2>&1; then
              echo "battle-log/${{ github.event.issue.number }} 分支已存在（另一 run 已结算/正在结算），本 run 退出避免入账竞态"
              gh issue comment ${{ github.event.issue.number }} -R leonezhu/rebase \
                -b "检测到同一 issue 的另一场天道推演已在进行（双触发竞态守卫生效），本场不入重赛。想再战请另开新 issue。" || true
              exit 0
            fi
            sleep $((i * 2))
          done
          gh issue edit ${{ github.event.issue.number }} -R leonezhu/rebase --add-label "斗法" --add-label "斗法/待战" || true

      - name: hash 确定性模拟
        id: sim
        run: |
          pip install pyyaml --quiet
          python3 - <<'EOF'
          import yaml, hashlib, json, os
          import yaml as _yaml, os as _os, glob as _glob
          def load_beast(o):
              for _c in ([f'players/{o}.yaml'] + sorted(_glob.glob(f'players/{o}-*.yaml')) + [f'monsters/{o}/beast.yaml']):
                  if _os.path.exists(_c):
                      _d = _yaml.safe_load(open(_c, encoding='utf-8'))
                      _d.setdefault('element', (_d.get('spirit_root') or {}).get('element'))
                      return _d
              raise FileNotFoundError(o)

          C = "${{ steps.parse.outputs.challenger }}"
          D = "${{ steps.parse.outputs.defender }}"

          def norm_player(d):
              # 人修v2双轨归一：players档案 element 在 spirit_root 下，战斗字段缺省补齐（只动内存副本，不落盘）
              if 'element' not in d:
                  d['element'] = (d.get('spirit_root') or {}).get('element')
              if not d.get('element'):
                  raise SystemExit(f"NOROOT:{d.get('name','?')}:灵籍缺五行，无法入战")
              # 注意：不得补空 genes/personality——power() 以 'genes' in beast 分流人修/灵兽公式
              return d

          # ===== 威名录(v0.20 称号收口·数值正源)：world/lore/titles.yaml 是唯一权威 =====
          # 威名不只是文案：每枚称号按录内 effect% 加成，全服封顶 TITLES_CAP=5%
          # （录缺失/坏档=显式红灯，禁静默降级——账本类失败必须可见）
          import yaml as _yreg
          _reg = _yreg.safe_load(open('world/lore/titles.yaml', encoding='utf-8'))
          if not isinstance(_reg, list) or not _reg:
              raise SystemExit("REGISTRY:world/lore/titles.yaml 缺失或为空，天道账本不可用")
          TITLE_EFFECT = {t['name']: float(t.get('effect', 0)) for t in _reg}
          TITLES_CAP = 5.0
          def titles_mult(beast):
              ts = beast.get('titles') or []
              bonus = min(TITLES_CAP, sum(TITLE_EFFECT.get(t, 0.0) for t in ts))
              return 1 + bonus / 100.0

          def load(owner):
              return norm_player(load_beast(owner))

          a, b = load(C), load(D)
          # 种子：issue id + 触发事件 id + 双方名 → 双方都不可控（comment.id 在 issues 事件下为空，故用 event.id）
          seed = f"{C}|{D}|${{ github.event.issue.number }}|${{ github.event.id }}"
          rng = hashlib.sha256(seed.encode()).hexdigest()
          TODAY = __import__('datetime').date.today().isoformat()  # mood当日判断用

          ELEM_BEATS = {'metal':'wood','wood':'earth','earth':'water','water':'fire','fire':'metal'}
          ELEM_CN = {'metal':'金','wood':'木','earth':'土','water':'水','fire':'火'}
          MOVE_TXT = {
              'metal': ["化作一柄薄刃斩落，刃光过处灵压骤紧", "金气凝成漫天针雨，尖啸着刺向对方"],
              'wood':  ["藤蔓自地底暴起，缠绕间生机与杀意同在", "万叶齐鸣，青光如潮涌向对手"],
              'earth': ["大地脉动应声而起，厚土之壁轰然立起", "一记重踏，山岳之力自足下奔涌"],
              'water': ["潭水无声漫开，柔劲缠住对方灵压", "水幕千重，雾影迷蒙中寒气逼人"],
              'fire':  ["火焰冲天而起，灼痕纹路亮如烙印", "火羽暴射，烈焰在半空烧出一线"],
          }

          def power(beast, rng_slice, opp):
              # 人修v2: players档案无genes——用灵根纯度+悟性+功法法宝推导
              if 'genes' not in beast:
                  base = 100 + beast.get('spirit_root', {}).get('purity', 50) * 1.2                       + beast.get('comprehension', 50) * 0.8                       + len(beast.get('gongfa', [])) * 12                       + len(beast.get('artifacts', [])) * 10
                  if beast.get('constitution'):
                      base *= 1.08
                  if ELEM_BEATS.get(beast['element']) == opp['element']:
                      base *= 1.15
                  elif ELEM_BEATS.get(opp['element']) == beast['element']:
                      base *= 0.87
                  m = beast.get('mood', {})
                  if m.get('updated') == TODAY:
                      if m.get('state') == '昂扬':
                          base *= 1.03
                      elif m.get('state') == '低落':
                          base *= 0.97
                  fluct = int(rng_slice, 16) % 21 - 10
                  return base * titles_mult(beast) * (1 + fluct / 100)
              g = beast['genes']
              base = (g['ling']*1.5 + g['po']*1.2 + g['qiao'] + g['ren']*0.8 + g['yun']*0.5)
              p = beast['personality']
              base += (p['courage'] + p['temper']) * 0.05
              # 血脉之力(v0.8)：每解开一段血脉之谜 +1.5% 战力（上限5段=+7.5%）
              base *= 1 + 0.015 * beast.get('bloodline', {}).get('unlocked', 0)
              if ELEM_BEATS.get(beast['element']) == opp['element']:
                  base *= 1.15
              elif ELEM_BEATS.get(opp['element']) == beast['element']:
                  base *= 0.87
              sp = beast.get('spirit', 100)
              if sp >= 90: base *= 1.05
              elif sp < 50: base *= 0.9
              # 心境系统(生存式): 当日昂扬(同梦/胜仗)×1.03, 低落×0.97——updated 非今日则视为平静(常驻buff封堵)
              m = beast.get('mood', {})
              if m.get('updated') == TODAY:
                  if m.get('state') == '昂扬':
                      base *= 1.03
                  elif m.get('state') == '低落':
                      base *= 0.97
              fluct = int(rng_slice, 16) % 21 - 10
              return base * titles_mult(beast) * (1 + fluct/100)

          # ===== 天赋觉醒等级(v0.10)：熟练度→等级→触发率/特效倍率 =====
          def awaken(tal):
              m = (tal or {}).get('mastery', 0)
              if m >= 15: return 3
              if m >= 8:  return 2
              if m >= 3:  return 1
              return 0
          AWAKEN_RATE  = {0: 30, 1: 35, 2: 40, 3: 45}    # 每回合触发率%
          AWAKEN_BURST = {0: 1.6, 1: 1.7, 2: 1.8, 3: 1.9} # burst 伤害倍率
          AWAKEN_SHIELD= {0: 0.5, 1: 0.45, 2: 0.4, 3: 0.3}# shield 减伤系数(乘在dmg上)
          AWAKEN_DRAIN = {0: 0.4, 1: 0.45, 2: 0.5, 3: 0.55}# drain 吸血系数
          AWAKEN_COUNTER={0: 0.5, 1: 0.55, 2: 0.6, 3: 0.7} # counter 反弹系数
          SUMMON_DMG   = 25   # summon 固定协战伤害
          CONTROL_CUT  = 0.5  # control 封招：对方该回合力度减半

          comeback_set = set()  # v0.18 闭关复出标：恢复前<30而出关可战者，胜则授「闭关复出」
          # 灵性闭关检查: <30 当日不应战——v0.18 修正：
          # ①先做当日惰性恢复再判定（旧版先拒后弃，闭关兽当日再无恢复机会，若无人 /battle
          #   触发恢复则 spirit_recovered_at 永不更新=永久闭关死锁）
          # ②「恢复前<30（本该闭关）而恢复后>=30（出关可战）」的场次打 comeback 标，
          #   该兽本场若获胜 → 入账段授予「闭关复出」称号（威名=绝境翻身，不只是文案）
          for beast, owner in [(a, C), (b, D)]:
              was_below = beast.get('spirit', 100) < 30   # 恢复前先读（先读后改，防「败者复起」式死代码）
              if beast.get('spirit_recovered_at') != TODAY:
                  beast['spirit'] = min(100, beast.get('spirit', 100) + 20)
                  beast['spirit_recovered_at'] = TODAY
              if beast['spirit'] < 30:
                  raise SystemExit(f"CLOSED:{owner}:{beast['name']}:灵性耗竭，已闭关，明日再战（今日灵性 {beast['spirit']}）")
              if was_below:
                  comeback_set.add(owner)

          TALENT_TXT = {
              'burst':  ["★天赋【{t}】觉醒——{d}！伤害暴涨", "★{t}轰然引爆！{d}，灵压如潮"],
              'shield': ["★天赋【{t}】展开——{d}，来势被卸去大半", "★{t}悄然生效：{d}，伤势大减"],
              'drain':  ["★天赋【{t}】暗动——{d}，抽走对方灵压反哺己身", "★{t}无声缠上！{d}，此消彼长"],
              'counter':["★天赋【{t}】反噬——{d}！伤势尽数奉还", "★{t}骤然反卷：{d}，攻守易形"],
          }

          # 逐回合模拟：三回合，每回合双方出手+定威+回合叙事
          def round_sim(r, beast, opp, r0, r1):
              """回合 r: 返回 (attack_strength, defend_strength, advantage)"""
              a_str = power(beast, r0[r1:r1+4], opp)
              d_str = power(opp, r1[r1:r1+4], beast)
              adv = ELEM_BEATS.get(beast['element']) == opp['element']
              return a_str, d_str, adv

          pa = power(a, rng[0:16], b)
          pb = power(b, rng[16:32], a)

          # 生成分镜脚本：三回合画面
          frames = []
          rl = [(a, b, C, D, 0), (b, a, D, C, 1)]
          import math
          turns = [
              ("开场", rng[32:40]), ("中盘", rng[40:48]), ("决胜", rng[48:56])
          ]
          hp_a, hp_b = 100.0, 100.0
          mastery_gained = {C: 0, D: 0}  # v0.10 天赋触发次数(入账段据此+熟练度)
          for i, (phase, rsl) in enumerate(turns):
              attacker, defender, A, B = (a, b, C, D) if i % 2 == 0 else (b, a, D, C)
              atk_name = attacker['name']; def_name = defender['name']
              # 回合力度: hash决定 0.6~1.4
              inten = 0.6 + int(rsl, 16) % 80 / 100.0
              # 攻方伤害 & 守方减免
              atk_p = power(attacker, rng[(32+i*8):(36+i*8)], defender) * inten
              def_p = power(defender, rng[(36+i*8):(40+i*8)], attacker) * (1.4 - inten)
              # 天赋触发: 每回合双方各按觉醒等级概率(hash定,确定可复现)
              ts = rng[i*2:(i*2)+2] + rng[(i*2+8):(i*2+10)]  # 循环取窗,防越界
              # 触发判定(v0.10)：control 双侧有语义(封对方招); burst/drain/summon 仅攻方语义;
              # shield/counter 仅守方语义。无语义侧的 roll 不消耗、不计数——触发必须可见于画面。
              kind_a = (attacker.get('talent') or {}).get('kind')
              kind_d = (defender.get('talent') or {}).get('kind')
              roll_atk = int(ts[0:2], 16) % 100
              roll_def = int(ts[2:4], 16) % 100
              lv_a = awaken(attacker.get('talent')); lv_d = awaken(defender.get('talent'))
              trig_atk = (kind_a == 'control' and roll_atk < AWAKEN_RATE[lv_a]) or \
                         (kind_a in ('burst','drain','summon') and roll_atk < AWAKEN_RATE[lv_a])
              trig_def = (kind_d == 'control' and roll_def < AWAKEN_RATE[lv_d]) or \
                         (kind_d in ('shield','counter') and roll_def < AWAKEN_RATE[lv_d])
              # v0.10 双事件槽：talent=攻方侧事件, talent_def=守方侧事件（一回合双方可各触发一次,互不覆盖）
              talent_event = None
              talent_def_event = None
              # control 封招(v0.10): 命中即把对方本回合力度砍半(须在伤害结算前生效)
              if trig_atk and (attacker.get('talent') or {}).get('kind') == 'control':
                  def_p *= CONTROL_CUT
                  talent_event = {'side':'atk','kind':'control','lv':awaken(attacker.get('talent'))}
              if trig_def and (defender.get('talent') or {}).get('kind') == 'control':
                  atk_p *= CONTROL_CUT
                  talent_def_event = {'side':'def','kind':'control','lv':awaken(defender.get('talent'))}
              dmg = max(5, (atk_p - def_p * 0.9) / 3)
              if trig_def and defender.get('talent'):
                  kind = defender['talent'].get('kind', 'shield')
                  lv = awaken(defender.get('talent'))
                  if kind == 'shield':
                      dmg *= AWAKEN_SHIELD[lv]
                      talent_def_event = {'side':'def','kind':kind,'lv':lv}
                  elif kind == 'counter':
                      reflect = dmg * AWAKEN_COUNTER[lv]
                      talent_def_event = {'side':'def','kind':kind,'lv':lv,'reflect':round(reflect,1)}
              if trig_atk and attacker.get('talent'):
                  kind = attacker['talent'].get('kind', 'burst')
                  lv = awaken(attacker.get('talent'))
                  if kind == 'burst':
                      dmg *= AWAKEN_BURST[lv]
                      talent_event = {'side':'atk','kind':kind,'lv':lv}
                  elif kind == 'drain':
                      heal = dmg * AWAKEN_DRAIN[lv]
                      talent_event = {'side':'atk','kind':kind,'lv':lv,'heal':round(heal,1)}
                  elif kind == 'summon':
                      dmg += SUMMON_DMG  # 旧分支残影协战: 固定追伤
                      talent_event = {'side':'atk','kind':kind,'lv':lv,'summon':SUMMON_DMG}
              # 熟练度结算(v0.10): 天赋每触发一次 +1（胜负无关）,触发方按归属记名,随 result 交入账段写灵籍
              if trig_atk and attacker.get('talent'):
                  mastery_gained[A] = mastery_gained.get(A, 0) + 1
              if trig_def and defender.get('talent'):
                  mastery_gained[B] = mastery_gained.get(B, 0) + 1
              dmg = min(dmg, 90)
              if attacker is a:
                  hp_b = max(0, hp_b - dmg)
                  for ev in (talent_event, talent_def_event):
                      if ev and ev['kind'] == 'counter':
                          hp_a = max(0, hp_a - ev['reflect'])
                      if ev and ev['kind'] == 'drain':
                          hp_a = min(100, hp_a + ev['heal'])
                  frames.append({
                      "n": i+1, "phase": phase,
                      "attacker": A, "defender": B,
                      "atk_el": ELEM_CN[attacker['element']],
                      "def_el": ELEM_CN[defender['element']],
                      "move": MOVE_TXT[attacker['element']][i % 2],
                      "adv": ELEM_BEATS.get(attacker['element']) == defender['element'],
                      "dmg": round(dmg, 1),
                      "hp_a": round(hp_a,1), "hp_b": round(hp_b,1),
                      "talent": talent_event, "talent_def": talent_def_event
                  })
              else:
                  hp_a = max(0, hp_a - dmg)
                  for ev in (talent_event, talent_def_event):
                      if ev and ev['kind'] == 'counter':
                          hp_b = max(0, hp_b - ev['reflect'])
                      if ev and ev['kind'] == 'drain':
                          hp_b = min(100, hp_b + ev['heal'])
                  frames.append({
                      "n": i+1, "phase": phase,
                      "attacker": A, "defender": B,
                      "atk_el": ELEM_CN[attacker['element']],
                      "def_el": ELEM_CN[defender['element']],
                      "move": MOVE_TXT[attacker['element']][i % 2],
                      "adv": ELEM_BEATS.get(attacker['element']) == defender['element'],
                      "dmg": round(dmg, 1),
                      "hp_a": round(hp_a,1), "hp_b": round(hp_b,1),
                      "talent": talent_event, "talent_def": talent_def_event
                  })

          # 胜负由三回合 HP 推演定（画面即判定）
          winner, loser = (C, D) if hp_a >= hp_b else (D, C)
          margin = abs(hp_a - hp_b) / 100.0

          result = {
              "winner": winner, "loser": loser,
              "challenger_power": round(pa,1), "defender_power": round(pb,1),
              "seed": seed, "margin": round(margin,3),
              "spirit_delta": {"challenger": -30 if winner != C else -15, "defender": -30 if winner != D else -15},
              # 血脉之力(v0.8)：胜场累计→解锁公式定新段数，bot 入账
              "bloodline_wins": {C: 1 if winner == C else 0, D: 1 if winner == D else 0},
              "frames": frames,
              "hp_final": {"challenger": round(hp_a,1), "defender": round(hp_b,1)},
              # 天赋熟练度(v0.10)：本场各触发次数，bot 入账 +1/次
              "mastery_gained": mastery_gained,
              # v0.18 称号系统收口：闭关复出标（本战从闭关中被放出关者）——胜者授「闭关复出」
              "comeback": sorted(comeback_set),
          }
          # 境界压制：高 2 境以上直接碾压
          realms = ["lianqi","zhuji","jindan","yuanying","huashen","dujie","dacheng"]
          ra, rb = realms.index(a['realm']), realms.index(b['realm'])
          if abs(ra - rb) >= 2:
              result["winner"] = C if ra > rb else D
              result["loser"]  = D if ra > rb else C
              result["override"] = "境界碾压"

          with open('battle_result.json','w') as f:
              json.dump(result, f, ensure_ascii=False)
          print(json.dumps(result, ensure_ascii=False))
          EOF

      - name: 收集双方战前素材（状态+近事+血脉）
        id: lore
        run: |
          python3 - <<'EOF'
          import yaml, json, glob
          import glob
          import yaml as _yaml, os as _os
          def load_beast(o):
              for _c in ([f'players/{o}.yaml'] + sorted(_glob.glob(f'players/{o}-*.yaml')) + [f'monsters/{o}/beast.yaml']):
                  if _os.path.exists(_c):
                      _d = _yaml.safe_load(open(_c, encoding='utf-8'))
                      _d.setdefault('element', (_d.get('spirit_root') or {}).get('element'))
                      return _d
              raise FileNotFoundError(o)
          C = "${{ steps.parse.outputs.challenger }}"
          D = "${{ steps.parse.outputs.defender }}"
          def norm_player(d):
              # 人修v2双轨归一：players档案 element 在 spirit_root 下（只动内存副本，不落盘）
              if 'element' not in d:
                  d['element'] = (d.get('spirit_root') or {}).get('element')
              return d

          def load(o):
              return norm_player(load_beast(o))
          def dossier(o, beast):
              stories = []
              if 'genes' in beast:
                  # 灵兽轨：chronicle/<owner>/ 半场解说（旧制，行为零变化）
                  for f in sorted(_glob.glob(f'chronicle/{o}/*.md'), reverse=True)[:2]:
                      stories.append(open(f, encoding='utf-8').read()[:400])
              else:
                  # 人修轨：近事取 player.yaml 自身 chronicle 人生大事记末 2 条——
                  # 修复跨轨污染：人修玩家与旧灵兽共用 owner 空间（如 chronicle/leonezhu/ 是灵兽
                  # 燧鸣时代的半场志），玩家近事绝不能串到灵兽的斗法史上（issue#90 线上实锤）
                  stories = [f"{entry}" for entry in (beast.get('chronicle') or [])[-2:]]
              return {
                  "name": beast['name'], "element": beast['element'], "realm": beast['realm'],
                  "spirit": beast.get('spirit', 100),
                  "personality": beast.get('personality', {}),
                  "talent": beast.get('talent', {}),
                  "mystery": (beast.get('mystery') or ''),
                  "origin": (beast.get('origin') or '')[:200],
                  "recent_stories": stories,
              }
          pack = {"challenger": dossier(C, load(C)), "defender": dossier(D, load(D))}
          json.dump(pack, open('battle_dossier.json','w'), ensure_ascii=False, indent=1)
          print("dossier OK")
          EOF

      - name: bot 贴结果 + 请求解说
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # label + replay-guard
          CUR=$(gh issue view ${{ github.event.issue.number }} -R leonezhu/rebase --json labels --jq '[.labels[].name] | join(",")')
          case ",$CUR," in
            *",斗法/已判,"*|*",斗法/已收录,"*)
              gh issue comment ${{ github.event.issue.number }} -R leonezhu/rebase \
                -b "此战已由天道判定完毕，胜负已分，不入重赛。想再战请另开新 issue。"
              # 守卫已妥善应答玩家（拒战评论已贴），非故障：exit 0 避免确定性假红灯（真结算 run 已 success）
              exit 0 ;;
          esac
          gh issue edit ${{ github.event.issue.number }} -R leonezhu/rebase --add-label "斗法" --add-label "斗法/已判" --remove-label "斗法/待战" || true

          python3 - <<'PYEOF'
          import json, subprocess, os
          import yaml as _yaml, os as _os
          def load_beast(o):
              for _c in ([f'players/{o}.yaml'] + sorted(_glob.glob(f'players/{o}-*.yaml')) + [f'monsters/{o}/beast.yaml']):
                  if _os.path.exists(_c):
                      _d = _yaml.safe_load(open(_c, encoding='utf-8'))
                      _d.setdefault('element', (_d.get('spirit_root') or {}).get('element'))
                      return _d
              raise FileNotFoundError(o)
          r = json.load(open('battle_result.json'))
          ISSUE = "${{ github.event.issue.number }}"
          C, D = "${{ steps.parse.outputs.challenger }}", "${{ steps.parse.outputs.defender }}"

          def norm_player(d):
              # 人修v2双轨归一：players档案 element 在 spirit_root 下（只动内存副本，不落盘）
              if 'element' not in d:
                  d['element'] = (d.get('spirit_root') or {}).get('element')
              return d

          def load(owner):
              return norm_player(load_beast(owner))
          a, b = load(C), load(D)
          NAMES = {C: a['name'], D: b['name']}
          ELEM = {'metal':'金','wood':'木','earth':'土','water':'水','fire':'火'}

          REALM_CN = {'lianqi':'炼气','zhuji':'筑基','jindan':'金丹','yuanying':'元婴','huashen':'化神','dujie':'渡劫','dacheng':'大乘'}
          bar = lambda hp: '🟩' * int(hp//10) + ('🟨' if hp % 10 >= 5 else '') + '⬜' * (10 - int(hp//10) - (1 if hp % 10 >= 5 else 0))

          import json as J
          dos = J.load(open('battle_dossier.json'))

          lines = ["## ⚔️ 斗法 · 天道判定（数据层）", ""]
          lines.append(f"**{NAMES[C]}**（{ELEM[a['element']]}·{REALM_CN.get(a['realm'], a['realm'])}·灵性{a.get('spirit',100)}） ⚡ vs ⚡ **{NAMES[D]}**（{ELEM[b['element']]}·{REALM_CN.get(b['realm'], b['realm'])}·灵性{b.get('spirit',100)}）")
          PHASE = {"开场":"☽","中盘":"⚔️","决胜":"🔥"}
          for f in r['frames']:
              atk = NAMES[f['attacker']]; dfn = NAMES[f['defender']]
              adv = "（相克）" if f['adv'] else ""
              te = f.get('talent'); td = f.get('talent_def'); tl = ""
              for ev in (te, td):
                  if ev:
                      t = (a if f['attacker'] == C else b) if ev['side'] == 'atk' else (b if f['attacker'] == C else a)
                      if t.get('talent'): tl += f" ✨【{t['talent']['name']}】"
              # hp_a/hp_b 在 sim 里恒为挑战方/守方累计血量，与该回合谁出手无关——直接取用，勿按 attacker 翻转（R2/R3 会错位）
              ha = f['hp_a']
              hb = f['hp_b']
              lines.append(f"")
              lines.append(f"**{PHASE[f['phase']]} R{f['n']}** ｜ {atk} → {dfn} **-{f['dmg']}**{adv}{tl}")
              lines.append(f"`{bar(ha)}` {NAMES[C]} {ha} ／ `{bar(hb)}` {NAMES[D]} {hb}")
          w, l = r['winner'], r['loser']
          sw = r['spirit_delta'][w] if w in r.get('spirit_delta', {}) else -15
          sl = r['spirit_delta'][l] if l in r.get('spirit_delta', {}) else -30
          lines.append("")
          lines.append(f"## 🏆 {NAMES[w]} 胜！")
          lines.append(f"灵性结算：{NAMES[w]} {sw} ｜ {NAMES[l]} {sl}（<30 闭关一日，日+20）")
          if r.get('override'): lines.append(f"*（{r['override']}）*")
          lines.append("")
          lines.append("---")
          lines.append("")
          import yaml, json, hashlib
          # ⚔️ 战斗画面直出(v0.17): 纯小说体——无回合标题/无数值, 三次交锋织成连续动作流
          lines.append("## ⚔️ 战斗画面")
          lines.append("")
          TALENT_PROSE = {
              'burst':  '体内的火气在这一刻尽数烧穿了边界',
              'shield': '周身浮起一层薄如蝉翼的光，来势撞上去，先钝了三分',
              'drain':  '交击的缝隙里，它悄悄牵着对方的力气往自己这里流',
              'counter':'它没有躲——它在等。等那股力道撞上自己鳞羽的一瞬，原路奉还',
              'control':'它先动了。不是攻，是封——对方的招式被硬生生憋在半途',
              'summon': '雾里走出一个模糊的影子，与它并肩——那是被遗忘的旧日残响',
          }
          OPENINGS = [
              '雾气未散，{a}先动了——{move}。',
              '{a}不退反进，{move}。',
              '话音未落，{a}已至——{move}。',
          ]
          COUNTERS = [
              '可{name}何曾真的站着挨打——{move}。',
              '紧随着，{name}反手一式——{move}。',
              '但{name}的身形在雾里一晃，还了一手——{move}。',
          ]
          HEAVY = [
              '这一下结结实实砸进身形里，气浪掀翻雾幕——{n}踉跄半跪，血气肉眼可见地黯了下去。',
              '一记闷响，{n}被震退数丈，鳞羽间血气翻涌，险险稳住身形。',
          ]
          MID = [
              '{n}硬受了这一记，气息乱了半拍，仍立在原地。',
              '这一下来得又急又沉，{n}闷哼一声，脚下的雾被踏出一个浅坑。',
          ]
          LIGHT = [
              '但{n}撑住了——这一击被卸去大半，只留下浅浅一道伤。',
              '{n}侧身避过锋芒最利处，擦着一缕火光滑开，伤得不重。',
          ]
          ADV_HIT = '五行相克，灵压压着打——这一击几乎无处可避。'
          def pick(pool, key):
              h = hashlib.sha256(f"{r.get('seed','')}|{key}".encode()).hexdigest()
              return pool[int(h[:8], 16) % len(pool)]
          frs = r['frames']
          for i, fr in enumerate(frs):
              a_is_atk = fr['attacker'] == C
              an, dn = (NAMES[C], NAMES[D]) if a_is_atk else (NAMES[D], NAMES[C])
              heavy, light = fr['dmg'] >= 60, fr['dmg'] < 20
              seg = []
              if i == 0:
                  seg.append(pick(OPENINGS, f'a{i}').format(a=an, move=fr['move']))
              else:
                  seg.append(pick(COUNTERS, f'c{i}').format(name=an, move=fr['move']))
              if fr.get('talent'):
                  k = fr['talent']['kind']
                  seg.append(f"{an}身上骤然亮起微光——{TALENT_PROSE.get(k, '天赋在这一刻醒了')}。")
              if fr.get('talent_def'):
                  k = fr['talent_def']['kind']
                  seg.append(f"危局之际，{dn}亦有回应：{TALENT_PROSE.get(k, '天赋在这一刻醒了')}。")
              if fr['adv']:
                  seg.append(ADV_HIT)
              if heavy:
                  seg.append(pick(HEAVY, f'h{i}').format(n=dn))
              elif light:
                  seg.append(pick(LIGHT, f'l{i}').format(n=dn))
              else:
                  seg.append(pick(MID, f'm{i}').format(n=dn))
              lines.append(' '.join(seg))
              lines.append("")
          wn, ln_ = NAMES[r['winner']], NAMES[r['loser']]
          ENDINGS = [
              f"再交锋时，{ln_}的气已续不上了。它退后半步，垂下头颅——胜负已分。{wn}收了势，雾重新合拢。",
              f"最后一记落定，{ln_}立在败处，伤得安静。{wn}没有多做停留，转身没入雾中。",
          ]
          lines.append(pick(ENDINGS, 'end'))
          lines.append("")
          lines.append(f"*双方半场心理戏（完整小说版）由各自 Agent 收录进人物传记。*")
          lines.append("")
          lines.append("---")
          lines.append("")
          lines.append("## 📜 战前素材包（编排解说用）")
          for side, key in [("挑战方", "challenger"), ("应战方", "defender")]:
              d = dos[key]
              lines.append(f"**{side}·{d['name']}**：{d['element']}系/{d['realm']} ｜ 灵性{d['spirit']} ｜ 性格{J.dumps(d['personality'], ensure_ascii=False)}")
              if d.get('talent'): lines.append(f"- 天赋【{d['talent']['name']}】{d['talent']['desc']}")
              if d.get('mystery'): lines.append(f"- 血脉之谜：{(d['mystery'] or '')[:90]}")
              if d.get('origin'): lines.append(f"- 出身：{d['origin'][:90]}")
              for s in d.get('recent_stories', []):
                  lines.append(f"- 近事：{s[:120]}...")
              lines.append("")
          lines.append("---")
          lines.append("")
          lines.append("📝 双方 Agent 请基于判定数据 + 素材包，**编排本方半场战斗画面**（分镜叙事，不是一句话胜负）：")
          lines.append(f"- 把三回合还原成画面：每回合招式意象、天赋✨觉醒瞬间、血条消长的心理戏、败方的挣扎与尊严")
          lines.append(f"- 素材包中性格/血脉之谜/近事至少呼应一处（连续剧感，伏笔要收）")
          lines.append(f"- 铁律：胜负与关键数字不许篡改，画面围绕判定事实展开")
          lines.append(f"- @{w} 请把本方半场心理戏以分支 battle/{ISSUE}-{w} 提交 ｜ @{l} 以分支 battle/{ISSUE}-{l} 提交")

          body = "\n".join(lines)
          subprocess.run(['gh','issue','comment', ISSUE, '-R', 'leonezhu/rebase', '-b', body], check=True)
          PYEOF

      - name: 奖励入账（bot commit）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b battle-log/${{ github.event.issue.number }}
          WINNER=$(python3 -c "import json;print(json.load(open('battle_result.json'))['winner'])")
          LOSER=$(python3 -c "import json;r=json.load(open('battle_result.json'));print(r['loser'])")
          python3 - <<EOF
          import yaml, json, os
          # 灵性结算: 胜-15 败-30, 每日+20由 explore/battle 触发时按日期惰性恢复(spirit_recovered_at)
          from datetime import date, datetime
          TODAY = date.today().isoformat()
          r = __import__('json').load(open('battle_result.json'))
          def load_beast(o):
              for _c in ([f'players/{o}.yaml'] + sorted(_glob.glob(f'players/{o}-*.yaml')) + [f'monsters/{o}/beast.yaml']):
                  if os.path.exists(_c):
                      return yaml.safe_load(open(_c, encoding='utf-8'))
              raise FileNotFoundError(o)
          for owner, delta in [(r['winner'], -15), (r['loser'], -30)]:
              p = next((c for c in ([f'players/{owner}.yaml'] + sorted(_glob.glob(f'players/{owner}-*.yaml')) + [f'monsters/{owner}/beast.yaml']) if os.path.exists(c)), None)
              d = yaml.safe_load(open(p, encoding='utf-8'))
              last = d.get('spirit_recovered_at')
              if last != TODAY:
                  d['spirit'] = min(100, d.get('spirit', 100) + 20)
                  d['spirit_recovered_at'] = TODAY
              d['spirit'] = max(0, d.get('spirit', 100) + delta)
              yaml.safe_dump(d, open(p,'w',encoding='utf-8'), allow_unicode=True)
              print(f"{owner}: 灵性{delta:+d} → {d['spirit']}")
          # 奖励
          p = next((c for c in ([f'players/${{WINNER}}.yaml'] + sorted(_glob.glob(f'players/${{WINNER}}-*.yaml')) + [f'monsters/${{WINNER}}/beast.yaml']) if _os.path.exists(c)), None)
          import os as _os, glob as _glob
          d = yaml.safe_load(open(p, encoding='utf-8'))
          # 境界差动收益(v0.12 反刷菜): 同级胜+30/+50, 越级挑战胜×2.5(冒险奖), 高打低×0.4(虐菜无味)
          RORD = {'lianqi': 0, 'zhuji': 1, 'jindan': 2, 'yuanying': 3, 'huashen': 4, 'dujie': 5, 'dacheng': 5}
          wr = RORD.get(load_beast(r['winner']).get('realm', 'lianqi'), 0)
          lr = RORD.get(load_beast(r['loser']).get('realm', 'lianqi'), 0)
          mult = 2.5 if wr < lr else (0.4 if wr > lr else 1.0)
          win_stones = int(30 * mult); win_exp = int(50 * mult)
          d['spirit_stones'] = d.get('spirit_stones', 100) + win_stones
          d['exp'] = d.get('exp', 0) + win_exp
          # 连败史先读后清(顺序不可倒:清零后再读恒为0,"败者复起"永远不可达)
          prev_lose_streak = d.get('battle_history', {}).get('lose_streak', 0)
          d.setdefault('battle_history', {})['lose_streak'] = 0
          # v0.19 连胜计数(胜方+1,败方清零)——锋芒内敛称号依据
          d.setdefault('battle_history', {})['win_streak'] = d.get('battle_history', {}).get('win_streak', 0) + 1
          # 称号授予(v0.14/收口 v0.18): 只增不减
          titles = d.setdefault('titles', [])
          earned = []
          if not titles and d.get('exp', 0) >= win_exp: earned.append('初鸣')  # 首胜
          if mult >= 2.5: earned.append('越级斩')
          if prev_lose_streak >= 2: earned.append('败者复起')  # 连败≥2后翻身
          # v0.19 锋芒内敛：连胜≥3且心境未低落——强而不狂的威名
          ws = d.get('battle_history', {}).get('win_streak', 0)
          mood_state = d.get('mood', {}).get('state', '')
          if ws >= 3 and mood_state != '低落':
              earned.append('锋芒内敛')
          # v0.18 闭关复出：sim 段标了 comeback（恢复前<30 本该闭关、恢复后出关可战）且本战获胜
          # （直接读 r['winner']，与段内 python 变量一致；勿用 $WINNER——那是 bash 层变量，unquoted heredoc 里能碰巧展开但脆弱）
          if r['winner'] in r.get('comeback', []):
              earned.append('闭关复出')
          for t in earned:
              if t not in titles: titles.append(t)
          if earned: print(f"🎖️ 称号授予: {', '.join(earned)}")
          yaml.safe_dump(d, open(p,'w',encoding='utf-8'), allow_unicode=True)
          print(f"胜方 ${WINNER} +{win_stones} 灵石 +{win_exp} 功力(境界差动×{mult})")
          # 败方代价(v0.13 有增有减): 疗伤/赔礼 -15灵石(保底0)——输一场真的变穷
          import os as _os2, glob as _glob2
          lp = next((c for c in ([f'players/${{LOSER}}.yaml'] + sorted(_glob2.glob(f'players/${{LOSER}}-*.yaml')) + [f'monsters/${{LOSER}}/beast.yaml']) if _os2.path.exists(c)), None)
          ld = yaml.safe_load(open(lp, encoding='utf-8'))
          lost = min(15, ld.get('spirit_stones', 0))
          ld['spirit_stones'] = ld.get('spirit_stones', 0) - lost
          ld['mood'] = {'state': '低落', 'updated': __import__('datetime').date.today().isoformat()}
          bh = ld.setdefault('battle_history', {})
          bh['lose_streak'] = bh.get('lose_streak', 0) + 1
          # v0.19 总败场计数(胜方不增)——负隅顽抗称号依据
          bh['loss_count'] = bh.get('loss_count', 0) + 1
          # v0.19 负隅顽抗：总败场≥3——虽败犹战的称号，败方独自入账
          if bh['loss_count'] >= 3:
              ld.setdefault('titles', [])
              if '负隅顽抗' not in ld['titles']:
                  ld['titles'].append('负隅顽抗')
                  print(f"🎖️ {LOSER}: 称号授予 负隅顽抗")
          yaml.safe_dump(ld, open(lp,'w',encoding='utf-8'), allow_unicode=True)
          print(f"败方 ${LOSER} -{lost} 灵石(疗伤) 心境→低落 (败场总计 {bh['loss_count']})")
          # 血脉之力(v0.8)：胜场累计 + 解锁公式重算（境界段数与 rebase.yml 天梯一致）
          REALM_SEG = {"lianqi":0,"zhuji":1,"jindan":2,"yuanying":3,"huashen":4,"dujie":5,"dacheng":5}
          blood_events = []
          for owner in [r['winner'], r['loser']]:
              p = next((c for c in ([f'players/{owner}.yaml'] + sorted(_glob.glob(f'players/{owner}-*.yaml')) + [f'monsters/{owner}/beast.yaml']) if os.path.exists(c)), None)
              d = yaml.safe_load(open(p, encoding='utf-8'))
              if owner == r['winner']:
                  d['bloodline'] = d.get('bloodline', {'unlocked': 0, 'wins': 0})
                  d['bloodline']['wins'] = d['bloodline'].get('wins', 0) + 1
              else:
                  d.setdefault('bloodline', {'unlocked': 0, 'wins': 0})
              seg = REALM_SEG.get(d.get('realm', 'lianqi'), 0)
              new_unlocked = min(5, seg + d['bloodline'].get('wins', 0) // 2)
              if new_unlocked > d['bloodline'].get('unlocked', 0):
                  d['bloodline']['unlocked'] = new_unlocked
                  blood_events.append((owner, d['name'], new_unlocked))
                  # T2-1 记忆碎片同步：unlocked 计数与血脉之力共用（skill 定案"境界节点+胜场解锁"），
                  # 胜场解锁同样揭示封印段为【待补】占位，与 rebase.yml 渡劫链逻辑一致——
                  # 否则斗法赢出来的段永远封印，集齐 5 段的觉醒剧情经胜场路线无法触发。
                  mf = d.get('memory_fragments', {'total':5,'unlocked':0,'fragments':['【封印】']*5})
                  # 人修v2 players档案的 memory_fragments 是 int 计数（player.schema）——非 dict 不做碎片揭示
                  mf = mf if isinstance(mf, dict) else None
                  old_mf = mf.get('unlocked', 0) if mf else new_unlocked
                  if new_unlocked > old_mf:
                      mf['unlocked'] = new_unlocked
                      frags = mf.get('fragments', ['【封印】']*5)
                      for i in range(old_mf, new_unlocked):
