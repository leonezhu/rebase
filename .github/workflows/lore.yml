name: Lore 共创收录（传说/遭遇投稿）
# 触发：lore/* 分支的 PR
# 校验投稿 schema + 数值硬边界 → 过校验打 player/待审 → 人审合并 → bot 发奖励

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  lore:
    if: startsWith(github.head_ref, 'lore/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 校验变更范围（只许 lore/ 下新增）
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          FAIL=0
          for f in $(git diff --name-only $BASE $HEAD); do
            case "$f" in
              lore/encounters/*.yaml|lore/*.md) ;;
              *) echo "::error::共创投稿只允许 lore/ 目录: $f"; FAIL=1 ;;
            esac
            if git cat-file -e $BASE:$f 2>/dev/null; then
              echo "::error::已收录内容不可修改（防篡改他人作品）: $f"; FAIL=1
            fi
          done
          exit $FAIL

      - name: Schema 校验 + 数值硬边界 + 署名一致性
        run: |
          pip install jsonschema pyyaml --quiet
          python3 - <<'EOF'
          import yaml, json, sys, subprocess
          from jsonschema import validate
          from pathlib import Path

          schema = json.load(open('schemas/lore.schema.json'))
          base, head = "${{ github.event.pull_request.base.sha }}", "${{ github.event.pull_request.head.sha }}"
          author = "${{ github.event.pull_request.user.login }}"
          files = subprocess.run(['git','diff','--name-only',base,head],capture_output=True,text=True).stdout.split()
          ok = True
          for f in files:
              if not f.endswith('.yaml'): continue
              d = yaml.safe_load(Path(f).read_text(encoding='utf-8'))
              try:
                  validate(d, schema)
              except Exception as e:
                  print(f"::error::{f} 校验失败: {e}"); ok = False; continue
              if d['contributor'] != author:
                  print(f"::error::{f}: contributor({d['contributor']}) 必须是 PR 作者({author})——禁止冒名投稿"); ok = False; continue
              # 故事禁技术术语
              banned = ['PR','workflow','commit','API','CI','hash','merge','issue']
              if any(b.lower() in d['story'].lower() for b in banned):
                  print(f"::error::{f}: 故事文本含技术术语（玩家可见文本零术语硬规则）"); ok = False; continue
              # 占位符白名单: 只许 {name}/{el}——其余 {...} 在结算段 str.format 会注入异常或坐标越界
              import re as _re
              bad_ph = ['{%s}' % m for m in _re.findall(r'\{([^}]*)\}', d['story']) if m not in ('name','el')]
              if bad_ph:
                  print(f"::error::{f}: story 占位符只许 {{name}}/{{el}}，发现 {bad_ph}"); ok = False; continue
              # 零收益遭遇拒绝: stones=0 且 exp=0 的投稿无游戏意义（白蹭著史奖励）
              if d['stones'] == 0 and d['exp'] == 0:
                  print(f"::error::{f}: stones 与 exp 不可同时为 0（零收益遭遇不收录）"); ok = False; continue
              print(f"✓ {f} «{d['name']}» 权重{d['weight']} 灵石{d['stones']:+d} 功力+{d['exp']} 投稿 @{author}")
          sys.exit(0 if ok else 1)
          EOF

      - name: 校验通过 → 打标签 + 留言
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr edit $PR -R leonezhu/rebase --add-label "player/待审" --add-label "共创" || true
          gh pr comment $PR -R leonezhu/rebase \
            -b "📜 投稿校验通过：数值边界合规、署名一致、文本零术语。

          等待缔约者长老过目。收录后你将获得灵石奖励 + **著史者**名录署名——全服灵兽都会读到你写的故事。" || true

      - name: 合并后 → 奖励入账（由 merge 后的 push 触发段处理）
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # 仅提示，实际奖励在 lore-reward job（merged 触发）执行
          echo "PR#$PR 校验通过，等待人审合并"
