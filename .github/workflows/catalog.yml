name: Catalog (灵籍图鉴)
# 触发：main push → 扫描 players/*.yaml → 生成图鉴静态页存 docs/catalog.html（不部署 Pages——线上页面统一由 pages.yml 管理，2026-10-14 修复主页覆盖事故）
# 图鉴 = 玩家可见的全服灵籍总览（主页 index.html）

on:
  push:
    branches: [main]
    paths:
      - 'players/**'
      - '.github/workflows/catalog.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 扫描灵籍生成图鉴 HTML
        run: |
          pip install pyyaml --quiet
          python3 - <<'EOF'
          import yaml, json, pathlib, html, datetime

          # ===== 威名对账闸(v0.20 称号收口)：world/lore/titles.yaml 是唯一权威 =====
          # 灵籍出现录外称号=伪造（威名只能天道授予）→ 显式红灯，禁静默放行
          _reg = yaml.safe_load(pathlib.Path('world/lore/titles.yaml').read_text(encoding='utf-8'))
          if not isinstance(_reg, list) or not _reg:
              raise SystemExit("威名录 world/lore/titles.yaml 缺失或为空——天道账本不可用")
          VALID_TITLES = {t['name'] for t in _reg}
          TITLE_EFFECT = {t['name']: float(t.get('effect', 0)) for t in _reg}
          TITLES_CAP = 5.0

          REALM_CN = {
              "lianqi": "炼气", "zhuji": "筑基", "jindan": "金丹",
              "yuanying": "元婴", "huashen": "化神", "dujie": "渡劫", "dacheng": "大乘",
          }
          ELEMENT_CN = {"metal": "金", "wood": "木", "earth": "土", "water": "水", "fire": "火"}
          ELEMENT_COLOR = {"metal": "#d4af37", "wood": "#6abf69", "earth": "#c98a4b",
                           "water": "#5aa7d4", "fire": "#e05a4e"}
          ELEMENT_GLYPH = {"metal": "☱", "wood": "☴", "earth": "☷", "water": "☵", "fire": "☲"}

          def power_of(d):
              g = d.get('genes', {})
              return round(g.get('ling', 0) * 1.5 + g.get('po', 0) * 1.2 + g.get('qiao', 0)
                           + g.get('ren', 0) * 0.8 + g.get('yun', 0) * 0.5)

          def trait(v, pos, neg):
              return pos if v >= 0 else neg

          cards = []
          beasts = sorted(pathlib.Path('players').glob('*.yaml'))
          for f in beasts:
              d = yaml.safe_load(f.read_text(encoding='utf-8'))
              if not d:
                  continue
              # 威名对账：录外称号=伪造，红灯终止
              _ts = d.get('titles') or []
              _fake = [t for t in _ts if t not in VALID_TITLES]
              if _fake:
                  raise SystemExit(f"威名对账失败：{f} 含录外称号 {_fake}——威名只能天道授予，禁止伪造")
              # 全服封顶对账：单灵籍加成和超 TITLES_CAP 同为账实不符
              _bonus = sum(TITLE_EFFECT.get(t, 0.0) for t in _ts)
              if _bonus > TITLES_CAP:
                  raise SystemExit(f"威名对账失败：{f} 称号加成合计 {_bonus}% 超全服封顶 {TITLES_CAP}%")
              sr = d.get('spirit_root') or {}
              el = sr.get('element') or d.get('element', 'fire')
              color = ELEMENT_COLOR.get(el, '#aaa')
              purity = sr.get('purity', 0)
              comp = d.get('comprehension', 0)
              stat_bars = ''.join(
                  f"<div class='gene'><span>{label}</span>"
                  f"<div class='bar'><i style='width:{v}%'></i></div>"
                  f"<b>{v}</b></div>"
                  for v, label in [(purity, '灵根'), (comp, '悟性')]
              )
              gongfa_list = d.get('gongfa') or []
              gongfa_str = ' · '.join(g.get('name','') for g in gongfa_list) if gongfa_list else '尚未习法'
              artifacts_list = d.get('artifacts') or []
              origin = html.escape((d.get('origin') or '').strip())
              mystery = html.escape((d.get('mood') or {}).get('state', '') if isinstance(d.get('mood'), dict) else '')
              # 威名(v0.14)：有称号才渲染，紫色一行
              titles = d.get('titles') or []
              titles_html = (f"<div class='titles'>🎖️ 威名：{html.escape(' · '.join(titles))}</div>" if titles else '')
              card = f"""
          <article class='card el-{el}'>
            <div class='card-head'>
              <span class='glyph'>{ELEMENT_GLYPH.get(el,'?')}</span>
              <div>
                <h2>{html.escape(d.get('name','?'))}</h2>
                <p class='sub'>@{html.escape(d.get('owner','?'))} · {REALM_CN.get(d.get('realm'),'?')}期 ·
                  <span style='color:{color}'>{ELEMENT_CN.get(el,'?')}行</span></p>
              </div>
            </div>
            <div class='stats'>战力 <b>{power_of(d)}</b> · 灵石 {d.get('spirit_stones',0)} · 功力 {d.get('exp',0)} · 灵根 {ELEMENT_CN.get(el, el)}·纯{purity} · 悟性 {comp}</div>
            {titles_html}
            <div class='genes'>{stat_bars}</div>
            <div class='stats'>功法：<b>{gongfa_str}</b></div>
            <details><summary>出身</summary><p>{origin}</p></details>
          </article>"""
              cards.append(card)

          now = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=8)))
          page = f"""<!DOCTYPE html>
          <html lang="zh-CN">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>万灵变基录 · 灵籍图鉴</title>
          <style>
            :root {{ --bg:#0b0e14; --panel:#131826; --line:#232b3f; --text:#c9d1e0; --dim:#7a86a0; }}
            * {{ margin:0; padding:0; box-sizing:border-box; }}
            body {{ background:var(--bg); color:var(--text);
                   font-family:"Noto Serif SC",serif; line-height:1.7; padding:3rem 1rem; }}
            header {{ text-align:center; margin-bottom:2.5rem; }}
            header h1 {{ font-size:2rem; letter-spacing:.35em; color:#e8d5a3; }}
            header p {{ color:var(--dim); margin-top:.5rem; font-size:.9rem; }}
            main {{ max-width:64rem; margin:0 auto; display:grid;
                    grid-template-columns:repeat(auto-fill,minmax(19rem,1fr)); gap:1.25rem; }}
            .card {{ background:var(--panel); border:1px solid var(--line); border-radius:.75rem;
                     padding:1.25rem; transition:transform .2s, box-shadow .2s; }}
            .card:hover {{ transform:translateY(-3px); box-shadow:0 8px 24px rgba(0,0,0,.5); }}
            .el-fire {{ border-top:3px solid {ELEMENT_COLOR['fire']}; }}
            .el-water {{ border-top:3px solid {ELEMENT_COLOR['water']}; }}
            .el-metal {{ border-top:3px solid {ELEMENT_COLOR['metal']}; }}
            .el-wood {{ border-top:3px solid {ELEMENT_COLOR['wood']}; }}
            .el-earth {{ border-top:3px solid {ELEMENT_COLOR['earth']}; }}
            .card-head {{ display:flex; gap:.75rem; align-items:center; }}
            .glyph {{ font-size:2rem; opacity:.85; }}
            h2 {{ font-size:1.3rem; color:#f0e6d0; }}
            .sub {{ color:var(--dim); font-size:.85rem; }}
            .stats {{ margin:.9rem 0; font-size:.88rem; color:var(--dim); }}
            .stats b {{ color:#e8d5a3; }}
            .gene {{ display:grid; grid-template-columns:1.5rem 1fr 2rem; gap:.4rem;
                     align-items:center; font-size:.8rem; margin:.15rem 0; }}
            .bar {{ background:#0b0e14; border:1px solid var(--line); border-radius:99px; height:.5rem; }}
            .bar i {{ display:block; height:100%; border-radius:99px;
                      background:linear-gradient(90deg,#5aa7d4,#e8d5a3); }}
            details {{ margin-top:.7rem; font-size:.85rem; border-top:1px dashed var(--line); padding-top:.6rem; }}
            summary {{ cursor:pointer; color:var(--dim); }}
            details p {{ margin-top:.5rem; color:var(--text); white-space:pre-wrap; }}
            .mystery summary {{ color:#8a6fb0; }}
            .titles {{ margin:.4rem 0; font-size:.88rem; color:#b08fd8; }}
            .el-egg {{ border-top:3px solid #7a86a0; opacity:.92; }}
            footer {{ text-align:center; color:var(--dim); font-size:.8rem; margin-top:3rem; }}
          </style>
          </head>
          <body>
          <header>
            <h1>万 灵 变 基 录</h1>
            <p>万物皆分支，唯有强者能变基 —— 全服灵籍 {len(beasts)} 册</p>
          </header>
          <main>{''.join(cards)}</main>
          <footer>图鉴随 main 分支自动重铸 · 最近更新 {now:%Y-%m-%d %H:%M}（北京时间）</footer>
          </body>
          </html>"""
          out = pathlib.Path('docs'); out.mkdir(exist_ok=True)
          (out / 'catalog.html').write_text(page, encoding='utf-8')
          print(f"✓ 图鉴生成：{len(beasts)} 册灵籍(存docs/不部署——Pages统一由pages.yml管理,防止覆盖主页)")
          EOF

      - name: 提交图鉴静态页到 docs/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/catalog.html || true
          git diff --cached --quiet || git commit -m "catalog: 图鉴静态页重铸(docs/catalog.html,不部署)"
          # 并发保险：push 与人写 push 竞速（我们 push 频繁）——失败退避重试, 至多 3 次
          for i in 1 2 3; do
            git pull --rebase origin main || git rebase --abort || true
            if git push origin main; then
              echo "push OK (第 $i 次)"; break
            fi
            echo "push 被拒(第 $i 次), 5s 后重试…"
            sleep 5
            [ "$i" = 3 ] && echo "::warning::catalog 页 3 次推送均被拒, 下次触发会重铸" && exit 1
          done
