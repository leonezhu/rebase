# 生存日常引擎(v3): 每日晨间为活跃灵兽自动跑一场"它昨天去了哪里"的生存事件
# - hash 确定性(日期+兽名): 同一天重跑结果不变, 可回放
# - 事件四型: 觅食(灵石+)/游荡(叙事)/拾遗(记忆闪回钩子)/遇险(灵石-)
# - journal 追加到 beast 同目录 daily/<date>.md, bot commit——纯叙事不入数值(数值只走 explore/battle/growth)
name: Daily Life (生存日常)
on:
  schedule:
    - cron: "10 1 * * *"   # UTC 01:10 = 上海 09:10 晨间
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-life
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: 跑生存事件（全部活跃灵兽）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pip install pyyaml --quiet
          python3 <<'EOF'
          import yaml, hashlib, json, glob
          from pathlib import Path
          from datetime import date, datetime, timezone, timedelta

          TZ = timezone(timedelta(hours=8))
          TODAY = datetime.now(TZ).date().isoformat()

          FIND = [
              ("forage",  "它循着晨露的气息翻过一道山梁，在一丛银穗草下掘出了几颗灵髓凝的晶砂——够吃两天。"),
              ("forage",  "溪水退去的滩涂上留着小鱼灵的残鳞，{name} 捡食了半晌，又用湿泥把鳞片埋好——它说不清为什么要这么做。"),
              ("wander",  "{name} 沿着旧山道走到尽头，那里有一棵烧焦的老树。它围着树走了三圈，把一棵新发的绿芽用爪子拢了拢土，走了。"),
              ("wander",  "午后它卧在崖边晒太阳，看云影在山谷里爬。有一阵风带来很远的叫声，它竖耳听了很久，没听懂，但很安心。"),
              ("relic",   "{name} 在浅滩的石缝里抠出一小片温热的东西——像一段谁的记忆凝成的屑。它愣了愣，把它收进了身上最深的绒毛里，打算献给缔约者。"),
              ("relic",   "暮色里它刨开一座小土丘，得到一枚冰凉的圆痕。它盯着看了一炷香，忽然觉得心口很静——像想起了什么好事。"),
              ("risk",    "{name} 贪走了一条没走过的岔道，被荆棘灵挂了一身口子。它舔着爪子回来，今天亏了几颗灵石疗伤——下次它大概还走那条路。"),
              ("risk",    "它误入一片沉雾，出来时发现自己绕回了原地，大半天白走。它对着空气哼了一声，像是骂了一句谁也听不懂的话。"),
          ]

          events_out = []
          for bf in sorted(glob.glob('monsters/*/beast.yaml')):
              d = yaml.safe_load(open(bf, encoding='utf-8'))
              owner = d['owner']
              seed = hashlib.sha256(f"{TODAY}-{owner}".encode()).hexdigest()
              roll = int(seed[:8], 16) % len(FIND)
              code, tpl = FIND[roll]
              story = tpl.format(name=d['name'])
              # 拾遗概率引碎片闪回钩子
              flashback = code == 'relic' and int(seed[8:10], 16) % 3 == 0
              events_out.append({"owner": owner, "name": d['name'], "code": code,
                                 "story": story, "flashback": flashback})

          Path('daily_result.json').write_text(json.dumps(events_out, ensure_ascii=False, indent=1), encoding='utf-8')
          print(json.dumps(events_out, ensure_ascii=False))
          EOF

      - name: 写生存日志 + bot commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 <<'EOF'
          import json, yaml
          from pathlib import Path
          from datetime import datetime, timezone, timedelta
          TZ = timezone(timedelta(hours=8))
          TODAY = datetime.now(TZ).date().isoformat()
          events = json.loads(Path('daily_result.json').read_text(encoding='utf-8'))
          for e in events:
              jdir = Path(f"monsters/{e['owner']}/daily")
              jdir.mkdir(parents=True, exist_ok=True)
              jf = jdir / f"{TODAY}.md"
              if jf.exists():
                  continue  # 幂等: 当日已写
              icon = {"forage": "🌾", "wander": "🌫️", "relic": "🪶", "risk": "🩸"}[e['code']]
              body = f"## {icon} {TODAY} 生存日志\n\n{e['story']}\n"
              if e['flashback']:
                  body += "\n> 🪶 那片温热的记忆屑里，似乎有一段模糊的画面——缔约者 Agent 可为此补一段前世闪回。\n"
              jf.write_text(body, encoding='utf-8')
          EOF
          git add monsters/*/daily/ daily_result.json
          git commit -m "生存日志: $(date -u -d '+8 hours' +%Y-%m-%d) 晨间自动" || echo "无变更"
          git push origin main
