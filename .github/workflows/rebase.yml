name: Rebase 进化（变基/渡劫）
# 触发：灵兽自己 issue 下评论 /rebase
# 校验：功力门槛(筑基=100) + 灵石天劫费(50) → 渡劫动画 + 境界+1 + 血脉之谜下一段

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  REGEX: '^\s*/rebase\s*$'

jobs:
  rebase:
    if: startsWith(github.event.comment.body, '/rebase')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 校验材料（功力门槛 + 灵石天劫费）+ 渡劫
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          RESULT=$(python3 - <<'PYEOF'
          import yaml, json, hashlib
          from datetime import datetime, timezone, timedelta
          import glob as _glob, os as _os
          _ACTOR = '${{ github.event.comment.user.login }}'
          _cands = [f'players/{_ACTOR}.yaml'] + sorted(_glob.glob(f'players/{_ACTOR}-*.yaml')) + [f'monsters/{_ACTOR}/beast.yaml']
          F = next((c for c in _cands if _os.path.exists(c)), None)
          if not F:
              print(json.dumps({'ok': False, 'msg': '尚无灵籍入册——先觉醒。'})); raise SystemExit
          d = yaml.safe_load(open(F, encoding='utf-8'))
          owner = d.get('owner', '${{ github.event.comment.user.login }}')
          TODAY = datetime.now(timezone(timedelta(hours=8))).date().isoformat()
          exp = d.get('exp', 0)
          stones = d.get('spirit_stones', 0)
          realm = d.get('realm', 'lianqi')

          # 境界阶梯与门槛（炼气→筑基→金丹→元婴→化神）
          # v0.12 节奏修正(用户反馈'升级太快没体验'): 门槛指数化, 每个境界待出故事来
          LADDER = [
              ('lianqi', None,  None),   # 新孵
              ('zhuji',  150,  80),      # 筑基：功力150 + 天劫费80灵石
              ('jindan', 500,  260),     # 金丹
              ('yuanying', 1500, 700),   # 元婴
              ('huashen', 4000, 1500),   # 化神
              ('dujie', 10000, 4000),    # 渡劫大劫
          ]
          idx = [i for i, (r, _, _) in enumerate(LADDER) if r == realm]
          if not idx:
              print(json.dumps({'ok': False, 'msg': '灵籍境界异常，天道拒绝推演'})); raise SystemExit
          idx = idx[0]
          if idx >= len(LADDER) - 1:
              print(json.dumps({'ok': False, 'msg': '已达当前天梯之顶（化神之上是渡劫大劫，另设）'})); raise SystemExit

          next_realm, need_exp, need_stones = LADDER[idx + 1]
          # 心境影响渡劫成功率(v0.13): 低落=心魔缠身直接劝返; 昂扬85%/平静70%成功
          if d.get('mood', {}).get('state') == '低落':
              print(json.dumps({'ok': False, 'msg': f"心魔未平：{d['name']} 心境低落，此刻渡劫雷劫必劈心魔。先陪它同梦修行，等心境平复再来。"})); raise SystemExit
          if exp < need_exp:
              lack = need_exp - exp
              print(json.dumps({'ok': False, 'msg': f'渡劫需功力 {need_exp}，{d["name"]} 仅有 {exp}，还差 {lack}。继续修行吧。'})); raise SystemExit
          if stones < need_stones:
              lack = need_stones - stones
              print(json.dumps({'ok': False, 'msg': f'天劫需灵石 {need_stones} 护体，囊中仅 {stones}，还差 {lack}。去秘境多走走。'})); raise SystemExit

          # 渡劫判定(v0.13 有增有减): 心境昂扬85%/平静70%成功; 失败=功力跌回30%+心境低落(灵石照扣,天劫不退)
          mood = d.get('mood', {}).get('state', '平静')
          rate = 0.85 if mood == '昂扬' else 0.70
          tribulation_seed = int(hashlib.sha256(f"{TODAY}-{realm}-{owner}".encode()).hexdigest()[:8], 16) % 100
          success = tribulation_seed < rate * 100
          if not success:
              d['exp'] = int(exp * 0.7)  # 功力跌回七成——伤筋动骨但不毁根基
              d['spirit_stones'] = stones - need_stones
              d['mood'] = {'state': '低落', 'updated': TODAY}
              yaml.safe_dump(d, open(F, 'w', encoding='utf-8'), allow_unicode=True, sort_keys=False)
              print(json.dumps({'ok': False, 'tribulation': 'failed', 'name': d['name'],
                                'msg': f"天劫骤变：{d['name']} 渡劫失败（心境{mood}，成功率{int(rate*100)}%）。功力跌回 {d['exp']}，灵石 {need_stones} 已随天劫散去。它趴在焦土上，心境跌入低谷——先陪它同梦休养，元气自会回来。养伤之后，再来。"}))
              raise SystemExit
          # 渡劫成功：境界+1，扣灵石；一次成=「破雷者」(v0.14)
          d['realm'] = next_realm
          d['spirit_stones'] = stones - need_stones
          titles = d.setdefault('titles', [])
          if '破雷者' not in titles: titles.append('破雷者')
          yaml.safe_dump(d, open(F, 'w', encoding='utf-8'), allow_unicode=True, sort_keys=False)
          open(os.environ['GITHUB_OUTPUT'], 'a').write(f'beast_file={F}\n')
          print(json.dumps({'ok': True, 'name': d['name'], 'from': realm, 'to': next_realm,
                            'cost': need_stones, 'balance': d['spirit_stones'], 'beast_file': F}))
          PYEOF
          )
          echo "$RESULT" > rebase_result.json
          BEAST_FILE=$(echo "$RESULT" | python3 -c "import sys,json;print(json.load(sys.stdin).get('beast_file','players/'))" 2>/dev/null || echo players/)
          export BEAST_FILE
          OK=$(python3 -c "import json;print(json.load(open('rebase_result.json'))['ok'])")
          if [ "$OK" != "True" ]; then
            MSG=$(python3 -c "import json;print(json.load(open('rebase_result.json'))['msg'])")
            gh issue comment $ISSUE -R leonezhu/rebase -b "⚡ 渡劫未成：$MSG"
            exit 1
          fi

          BRANCH="rebase-log/$ISSUE"
          git checkout -b "$BRANCH"
          git add "$BEAST_FILE"
          git commit -m "渡劫成功: issue#$ISSUE 燧鸣变基$(python3 -c "import json;d=json.load(open('rebase_result.json'));print(d['from']+'→'+d['to'])")"
          git push origin "$BRANCH"
          gh pr create -R leonezhu/rebase --head "$BRANCH" --base main \
            -t "⚡ 渡劫入账 #$ISSUE" -b "bot 结算，自动合并" --label "game/bot" || true
          sleep 2
          gh pr merge "$BRANCH" --merge

      - name: 渡劫动画（bot 贴出）
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          python3 - <<'PYEOF'
          import json, subprocess
          d = json.load(open('rebase_result.json'))
          NAMES = {'lianqi': '炼气', 'zhuji': '筑基', 'jindan': '金丹', 'yuanying': '元婴', 'huashen': '化神'}
          fr, to = NAMES[d['from']], NAMES[d['to']]
          body = f"""## ⚡ 天劫落下——变基之时

          > {d['name']} 仰首而立。雷云不是从天上来的——是从这个仓库所有被丢弃的提交里升起来的。

          **第一道雷：所有曾被视为失败的重试，劈落。** 它没有躲。
          **第二道雷：那些半途而废的分支，劈落。** 羽翼上的灼痕纹路亮了。
          **第三道雷：** 雷停了。云散了。世界像被谁 `git rebase` 过一遍，干干净净。

          ## 🏆 {d['name']} 变基成功：{fr} → **{to}**

          灵石护体耗 {d['cost']}，余额 {d['balance']}。

          ---
          *天道公告：自此刻起，万灵图鉴上它的名字换了颜色。*
          *血脉之谜的下一页，在雷声停止的方向。*"""
          subprocess.run(['gh', 'issue', 'comment', '${{ github.event.issue.number }}',
                          '-R', 'leonezhu/rebase', '-b', body], check=True)
          PYEOF

      - name: 血脉之力入账（v0.8：境界段数上涨→解锁新段）
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          # 渡劫入账 PR 已合并，从 origin/main 重读权威状态
          git fetch origin main --depth=1
          git checkout origin/main -- players/ 2>/dev/null || git checkout origin/main -- monsters/
          NEW=$(python3 - <<'PYEOF'
          import yaml, json
          SEG = {"lianqi":0,"zhuji":1,"jindan":2,"yuanying":3,"huashen":4,"dujie":5,"dacheng":5}
          import glob as _g2, os as _os2
          _A2 = '${{ github.event.comment.user.login }}'
          _c2 = [f'players/{_A2}.yaml'] + sorted(_g2.glob(f'players/{_A2}-*.yaml')) + [f'monsters/{_A2}/beast.yaml']
          F = next((c for c in _c2 if _os2.path.exists(c)), None)
          d = yaml.safe_load(open(F, encoding='utf-8'))
          bl = d.get('bloodline', {'unlocked': 0, 'wins': 0})
          new_unlocked = min(5, SEG[d['realm']] + bl.get('wins', 0) // 2)
          if new_unlocked > bl.get('unlocked', 0):
              bl['unlocked'] = new_unlocked
              d['bloodline'] = bl
              # T2-1 记忆碎片同步：unlocked 段数上涨 → 封印段揭示（本段文本暂以【待补·段N】入册，Agent 在解说 PR 中补全叙事）
              mf = d.get('memory_fragments', {'total':5,'unlocked':0,'fragments':['【封印】']*5})
              old_mf = mf.get('unlocked', 0)
              if new_unlocked > old_mf:
                  mf['unlocked'] = new_unlocked
                  frags = mf.get('fragments', ['【封印】']*5)
                  for i in range(old_mf, new_unlocked):
                      if i < len(frags) and frags[i] == '【封印】':
                          frags[i] = f'【待补·第{i+1}段——渡劫天雷中闪回的碎片，由缔约者 Agent 编排后入册】'
                  mf['fragments'] = frags
                  d['memory_fragments'] = mf
              yaml.safe_dump(d, open(F, 'w', encoding='utf-8'), allow_unicode=True, sort_keys=False)
              print(f"UNLOCKED:{new_unlocked}")
              print(f"BEAST_FILE:{F}")
              print('AWAKEN' if mf.get('unlocked',0) >= 5 else 'NO-AWAKEN')
          else:
              print("NONE")
          PYEOF
          )
          if [ "$NEW" = "NONE" ]; then
            echo "血脉段数无变化，跳过入账"
            exit 0
          fi
          N=$(echo "$NEW" | grep -oP '(?<=UNLOCKED:)\d+')
          AWAKEN=$(echo "$NEW" | grep -o 'AWAKEN$' || echo NO)
          BEAST_FILE=$(echo "$NEW" | grep -oP '(?<=BEAST_FILE:).*' | head -1)
          BRANCH="bloodline-log/$ISSUE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add "$BEAST_FILE"
          git commit -m "血脉之力: issue#$ISSUE 解开第${N}段（境界段数上涨）"
          # 入账链咽喉点：push/create/merge 失败必须显式红灯（禁 || true 吞错）
          git push origin "$BRANCH"
          gh pr create -R leonezhu/rebase --head "$BRANCH" --base main \
            -t "🩸 血脉之力入账 #$ISSUE" -b "bot 结算，自动合并"
          gh pr edit "$BRANCH" -R leonezhu/rebase --add-label "game/bot" || true
          gh pr merge "$BRANCH" --merge
          gh issue comment "$ISSUE" -R leonezhu/rebase \
            -b '## 🩸 血脉之力 · 苏醒

          > 渡劫的雷声里，它想起了一段更早的事。

          **血脉之谜解开第 '"${N}"' 段 —— 战力 +'"$(python3 -c "print(round($N*1.5,1))")"'%**

          *血脉之力：每解开一段血脉之谜 +1.5% 战力（上限5段）。境界攀升与斗法胜场，都会撕开新的页。*'
