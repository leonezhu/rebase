name: Meta Labels (规则层标记)
# 双轨制 meta 通道：改 workflow/schema/README/DESIGN 等规则层的 PR
# → 自动打 meta/规则 标签 + 触发 CODEOWNERS review 要求（branch protection 侧生效）
# 本 workflow 只负责标记，不做校验不合并

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]
  push:
    branches: [main]

permissions:
  pull-requests: write
  issues: write

jobs:
  label:
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: 检测规则层变更并打标签
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # 用 PR files API 而非 git diff：浅克隆拿不到 base sha（fatal: bad object）
          FILES=$(gh pr view "$PR" -R "${{ github.repository }}" --json files --jq '.files[].path')

          META=0
          for f in $FILES; do
            case "$f" in
              .github/*|*.yml|*.yaml|schemas/*|DESIGN.md|README.md)
                echo "规则层文件: $f"; META=1 ;;
            esac
          done

          if [ "$META" = "1" ]; then
            gh pr edit "$PR" -R "${{ github.repository }}" --add-label "meta/规则"
            gh pr comment "$PR" -R "${{ github.repository }}" \
              -b "⚖️ 本 PR 触碰规则层（workflow/schema/设计文档），已按双轨制打 \`meta/规则\` 标签，需仓库缔约者 review 后方可合并。"
            echo "已打 meta/规则 标签"
          else
            echo "非规则层变更，不打标"
          fi

  # ===== 幂等建标签兜底：游戏标签缺失时自动补建 =====
  # 触发：labels.yml 自身变更合入 main（改标签体系时必然经过此文件）
  ensure-labels:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: 幂等创建游戏标签（存在则跳过）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          create() { gh label create "$1" -R "${{ github.repository }}" --color "$2" --description "$3" 2>/dev/null \
            && echo "✓ 建标签 $1" || echo "· $1 已存在，跳过"; }
          create "降世"       "0e8a16" "角色觉醒传记（每人一个，永久主页/操作台）"
          create "斗法"       "d93f0b" "对战 issue"
          create "斗法/待战"   "fbca04" "斗法已发起，等待天道判定"
          create "斗法/已判"   "f9d0c4" "天道已判定胜负，等双方解说"
          create "斗法/已收录" "0e8a16" "双方解说已合并收录进传记"
          create "秘境"       "6f42c1" "定时投放的世界事件"
          create "兵解"       "cccccc" "角色退场申请与冷静期追踪"
          create "悖论"       "e99695" "玩家上报异常，全服可见审计入口"
          create "杂谈"       "0075ca" "社区闲聊，可乱"
