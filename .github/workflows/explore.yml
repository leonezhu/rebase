name: Explore (秘境探索)
# 触发：任意 issue 评论 /explore
# hash 确定性遭遇 → bot 贴事件故事 → 灵石/功力入账 bot commit
# 规则：只结算评论者自己的灵兽；每兽每日至多 3 次探索

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  explore:
    if: startsWith(github.event.comment.body, '/explore')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 找到探索者的灵籍
        id: beast
        env:
          GH_TOKEN: ${{ github.token }}
          EXPLORER: ${{ github.event.comment.user.login }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          F="monsters/$EXPLORER/beast.yaml"
          if [ ! -f "$F" ]; then
            gh issue comment $ISSUE -R leonezhu/rebase \
              -b "@${EXPLORER} 你尚未缔约（monsters/$EXPLORER/beast.yaml 不存在），秘境之门不识你的气息。先去 README 缔约领养一只灵兽吧。"
            exit 1
          fi
          # 每日限额：查当日已入账的探索次数（bot commit 信息含"秘境探索"）。
          # 按 committer 上海本地日期精确过滤——不用 git --since="today 00:00"：
          # 实测 approxidate 对该语法解析不可靠（返回空集），会导致每日 3 次限额永不触发
          TODAY=$(TZ=Asia/Shanghai git log --format="%cd|%s" --date=format-local:"%Y-%m-%d" -- "$F" \
            | grep "^$(TZ=Asia/Shanghai date +%Y-%m-%d)|" | grep -c "秘境探索" || true)
          # 转世豁免(v0.13): 灵籍created_at=今日(新缔约/转世第一日)不计旧账——new life new day
          CREATED=$(python3 -c "import yaml;print(str(yaml.safe_load(open('$F', encoding='utf-8')).get('created_at',''))[:10])")
          if [ "$CREATED" = "$(TZ=Asia/Shanghai date +%Y-%m-%d)" ]; then TODAY=0; fi
          if [ "${TODAY:-0}" -ge 3 ]; then
            gh issue comment $ISSUE -R leonezhu/rebase \
              -b "@${EXPLORER} 今日秘境已探索 ${TODAY} 次，灵兽灵力耗竭，明日再来（每日限 3 次）。"
            exit 1
          fi
          echo "explorer=$EXPLORER" >> $GITHUB_OUTPUT
          echo "today=$TODAY" >> $GITHUB_OUTPUT

      - name: hash 定遭遇 + 结算
        id: enc
        run: |
          pip install pyyaml jsonschema --quiet
          python3 - <<'EOF'
          import yaml, hashlib, json, sys
          from pathlib import Path

          OWNER = "${{ steps.beast.outputs.explorer }}"
          # 种子：评论者 + 评论 id + 当日已探索次数 → 同一评论重跑结果不变，玩家不可控
          seed = f"explore|{OWNER}|${{ github.event.comment.id }}|${{ steps.beast.outputs.today }}"
          rng = hashlib.sha256(seed.encode()).hexdigest()

          p = Path(f'monsters/{OWNER}/beast.yaml')
          d = yaml.safe_load(p.read_text(encoding='utf-8'))

          # 遭遇表：权重不同的 8 种秘境事件（零术语，玄幻文本）
          el_map = {'metal': '金', 'wood': '木', 'earth': '土', 'water': '水', 'fire': '火'}
          el_cn = el_map.get(d['element'], '?')
          ENCOUNTERS = [
              # (code, 权重, 灵石, 功力, 故事模板)
              ("herb",    20,  15,  10, "灵草丛生：{name} 拨开齐腰的银穗草，草根处一窝灵髓凝成的露珠滚落掌心。它以{el}行气息温养片刻，露珠化作灵石收入囊中。"),
              ("array",   15,  30,   5, "残破法阵：半座上古法阵嵌在崖壁上，阵眼还在微微搏动。{name} 用{el}行灵力引动残留阵纹——法阵自行崩解，积蓄千年的灵石如雨落下。"),
              ("beast",   20,  25,  15, "秘境兽·遭遇：一头无主野兽从雾里扑出！{name} 沉腰蓄势，{el}行灵光缠上爪尖，三合之内将其逼退。野兽丢下衔来的宝物，遁入雾中。"),
              ("beast_lose", 10, -10,  0, "秘境兽·恶战：雾中那头野兽比看上去更强。{name} 苦战不支，身上几颗灵石在翻滚中散落，被野兽叼走。它舔着伤口退出来——败不亡身，来日再战。"),
              ("well",     8,   0,  50, "无底古井：井口刻满无人识得的符文。{name} 俯身探望，井底忽然映出的不是倒影，而是一段陌生的修行画面。它怔怔看了半晌，功力大涨，却说不出所以然。"),
              ("lost",    12,   0,   5, "雾中迷路：白雾把方向嚼碎了。{name} 走了许久，只在树干上发现前人刻下的一行小字：'迷路亦是路。'虽无收获，心境倒是圆融了几分。"),
              ("cave",    10,   0,  40, "前辈洞府：山腹中一座洞府，蒲团上只余一枚早已圆寂的舍利。{name} 恭敬叩首，殿中残存的道韵涌入它的{el}行根骨——前辈传功，不问来者。"),
              ("spring",   5,  20,  20, "灵泉洗髓：一汪灵泉藏于石缝之后，泉水分七色流转。{name} 沉入泉底，鳞羽尽洗，出泉时通身{el}光湛然，灵石碎屑沉在泉底也被它顺手捞了上来。"),
          ]
          # 共创遭遇动态并入: lore/encounters/*.yaml——运行时 schema 硬边界(DESIGN.md 行322):
          # lore.yml 投稿闸已审一遍,此处运行时复检三道闸(schema/占位符白名单/零术语),
          # 任一不过=显式红灯终止(run 不静默降级)——投稿闸被改/绕过时结算侧兜底
          import glob
          from jsonschema import validate as _jsvalidate
          _schema = json.load(open('schemas/lore.schema.json'))
          _banned_terms = ['PR', 'workflow', 'commit', 'API', 'CI', 'hash', 'merge', 'issue']
          def _bad_placeholders(story):
              # 只许 {name}/{el};其余带参 {...} 拒(防 str.format 注入/坐标越界)
              bad, i = [], 0
              while i < len(story):
                  if story[i] == '{':
                      j = story.find('}', i)
                      if j == -1:
                          bad.append(story[i:i+20]); break
                      if story[i+1:j] not in ('name', 'el'):
                          bad.append('{%s}' % story[i+1:j])
                      i = j + 1
                  else:
                      i += 1
              return bad
          for f in sorted(glob.glob('lore/encounters/*.yaml')):
              try:
                  ed = yaml.safe_load(Path(f).read_text(encoding='utf-8'))
                  if not isinstance(ed, dict):
                      raise ValueError('顶层不是映射')
                  _jsvalidate(ed, _schema)
                  _bad = _bad_placeholders(str(ed['story']))
                  if _bad:
                      raise ValueError(f'story 非法占位符 {_bad}(只许 {{name}}/{{el}})')
                  _hit = [b for b in _banned_terms if b.lower() in str(ed['story']).lower()]
                  if _hit:
                      raise ValueError(f'story 含技术术语 {_hit}')
                  ENCOUNTERS.append((Path(f).stem, int(ed['weight']),
                                     int(ed['stones']), int(ed['exp']), str(ed['story'])))
              except Exception as ex:
                  print(f'::error::遭遇投稿 {f} 运行时校验不过(显式红灯,不静默降级): {ex}')
                  sys.exit(1)
          total = sum(e[1] for e in ENCOUNTERS)
          roll = int(rng[:8], 16) % total
          acc, picked = 0, ENCOUNTERS[0]
          for e in ENCOUNTERS:
              acc += e[1]
              if roll < acc:
                  picked = e
                  break
          code, _, stones, exp, tpl = picked

          story = tpl.format(name=d['name'], el=el_cn)
          # 灵石不可为负
          old_stones = d.get('spirit_stones', 100)
          d['spirit_stones'] = max(0, old_stones + stones)
          d['exp'] = d.get('exp', 0) + exp
          # ===== T3 灵兽社交 (v0.16)：25% 概率遭遇替换为同仓相遇剧情 =====
          # 数值归系统：亲疏=五行相生相克+性格L1距离（确定性查表）；文案归文案池（lore/social.yaml）
          # 防刷：world/social_log.yaml bot 独占写 + 落盘前 jsonschema 自校验 + 同对每日1次 + 只留近7日
          SOCIAL_SCHEMA = json.load(open('schemas/social.schema.json'))
          from jsonschema import validate as _sv
          _TODAY = __import__('datetime').datetime.now(__import__('datetime').timezone(__import__('datetime').timedelta(hours=8))).strftime('%Y-%m-%d')
          social_result = None
          if int(rng[8:12], 16) % 100 < 25:
              import glob as _glob
              candidates = []
              for mf in sorted(_glob.glob('monsters/*/beast.yaml')):
                  parts = mf.split('/')
                  if parts[1] == OWNER:
                      continue
                  od = yaml.safe_load(Path(mf).read_text(encoding='utf-8'))
                  if od.get('stage') not in ('hatched', 'npc', None) or od.get('stage') == 'egg':
                      continue
                  candidates.append((parts[1], od))
              if candidates:
                  other_owner, od = candidates[int(rng[12:16], 16) % len(candidates)]
                  GEN = {'metal': 'water', 'water': 'wood', 'wood': 'fire', 'fire': 'earth', 'earth': 'metal'}
                  OVER = {'metal': 'wood', 'wood': 'earth', 'earth': 'water', 'water': 'fire', 'fire': 'metal'}
                  pa, pb = d['personality'], od['personality']
                  _dist = sum(abs(pa[k] - pb[k]) for k in ('courage', 'temper', 'pride'))
                  if GEN.get(d['element']) == od['element'] or GEN.get(od['element']) == d['element']:
                      relation = '亲和'
                  elif OVER.get(d['element']) == od['element'] or OVER.get(od['element']) == d['element']:
                      relation = '宿敌' if _dist > 180 else '萍水'
                  else:
                      relation = '亲和' if _dist <= 120 else ('宿敌' if _dist > 180 else '萍水')
                  # 查重（同对每日1次）+ 滚动窗口（近7日）
                  LOGF = Path('world/social_log.yaml')
                  log = yaml.safe_load(LOGF.read_text(encoding='utf-8')) if LOGF.exists() else {'log': []}
                  entries = log.get('log') or []
                  pair_key = sorted([OWNER, other_owner])
                  if any(e.get('pair') == pair_key and e.get('date') == _TODAY for e in entries):
                      print(f'SOCIAL: {pair_key} 今日已相遇，跳过（同对每日1次）')
                  else:
                      entries = [e for e in entries
                                 if str(e.get('date', '')) >= (__import__('datetime').datetime.now(__import__('datetime').timezone(__import__('datetime').timedelta(hours=8))) - __import__('datetime').timedelta(days=7)).strftime('%Y-%m-%d')]
                      PAYLOAD = {'stones': {'亲和': 12, '萍水': 0, '宿敌': -6}[relation],
                                 'exp': {'亲和': 8, '萍水': 4, '宿敌': 10}[relation]}
                      entries.append({'date': _TODAY, 'pair': pair_key, 'relation': relation,
                                      'stones': PAYLOAD['stones'], 'exp': PAYLOAD['exp']})
                      log = {'log': entries}
                      _sv(log, SOCIAL_SCHEMA)  # 落盘前自校验，不过=显式红灯
                      # 文案池三闸复检（schema: relation字段 + 占位符白名单 + 零术语）
                      social_pool = yaml.safe_load(Path('lore/social.yaml').read_text(encoding='utf-8'))
                      _cands = [t for t in social_pool['templates'] if t['relation'] == relation]
                      _banned_terms = ['PR', 'workflow', 'commit', 'API', 'CI', 'hash', 'merge', 'issue']
                      _tpl = _cands[int(rng[16:20], 16) % len(_cands)]
                      _bad_ph = []
                      _s = str(_tpl['story']); _i = 0
                      while _i < len(_s):
                          if _s[_i] == '{':
                              _j = _s.find('}', _i)
                              if _j == -1 or _s[_i+1:_j] not in ('name', 'other', 'el'):
                                  _bad_ph.append(_s[_i:_i+20])
                              _i = (_j + 1) if _j != -1 else len(_s)
                          else:
                              _i += 1
                      _hit = [b for b in _banned_terms if b.lower() in _s.lower()]
                      if _bad_ph or _hit:
                          print(f"::error::社交文案池条目 {_tpl['id']} 校验不过(占位符{_bad_ph}/术语{_hit})——显式红灯,不静默降级")
                          sys.exit(1)
                      el_cn_o = el_map.get(d['element'], '?')
                      social_story = str(_tpl['story']).format(
                          name=d['name'], other=str(od['name']), el=el_cn_o)
                      # 数值入账：社交剧情替换本次普通遭遇的收益
                      stones = PAYLOAD['stones']
                      exp = PAYLOAD['exp']
                      code = f"social-{relation}"
                      story = social_story
                      d['spirit_stones'] = max(0, old_stones + stones)
                      d['exp'] = d.get('exp', 0) + exp
                      LOGF.parent.mkdir(parents=True, exist_ok=True)
                      LOGF.write_text(yaml.safe_dump(log, allow_unicode=True, sort_keys=False), encoding='utf-8')
                      social_result = {'other_owner': other_owner, 'relation': relation,
                                       'stones': stones, 'exp': exp}
                      print(f"SOCIAL: {OWNER} x {other_owner} = {relation} ({stones}灵石/{exp}功力)")
              else:
                  print('SOCIAL: 无同仓候选，跳过')
          # 称号(v0.14): 只增不减——首次探索踏雾者/单次大收获寻珍者
          titles = d.setdefault('titles', [])
          earned = []
          if '踏雾者' not in titles and d.get('exp', 0) <= exp:
              earned.append('踏雾者')  # 首探(exp恰好等于本次所得=此前为0)
          if '寻珍者' not in titles and exp >= 20:
              earned.append('寻珍者')
          for t in earned:
              titles.append(t)
          if earned:
              print(f"TITLES:{','.join(earned)}")
          if stones < 0:
              stones = d['spirit_stones'] - old_stones  # 实际损失（保底后，保持负号——丢灵石不可记成正入账）

          p.write_text(yaml.safe_dump(d, allow_unicode=True, sort_keys=False), encoding='utf-8')
          result = {
              "owner": OWNER, "code": code,
              "stones": stones, "exp": exp,
              "balance": d['spirit_stones'], "story": story,
              "seed": seed, "social": social_result,
          }
          Path('explore_result.json').write_text(json.dumps(result, ensure_ascii=False), encoding='utf-8')
          print(json.dumps(result, ensure_ascii=False))
          EOF

      - name: bot 贴事件故事
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          STORY=$(python3 -c "import json;print(json.load(open('explore_result.json'))['story'])")
          STONES=$(python3 -c "import json;d=json.load(open('explore_result.json'));v=d['stones'];print(('+' if v>0 else '')+str(v))")
          EXP=$(python3 -c "import json;d=json.load(open('explore_result.json'));print('+'+str(d['exp']) if d['exp'] else '0')")
          BAL=$(python3 -c "import json;print(json.load(open('explore_result.json'))['balance'])")
          NAME=$(python3 -c "import yaml;print(yaml.safe_load(open('monsters/${{ steps.beast.outputs.explorer }}/beast.yaml', encoding='utf-8'))['name'])")
          HEADER="秘境探索"
          SOCIAL_TAIL=""
          if python3 -c "import json,sys;sys.exit(0 if json.load(open('explore_result.json')).get('social') else 1)"; then
            HEADER="秘境探索 · 同仓相遇"
            SOCIAL_TAIL=$(python3 -c "import json;s=json.load(open('explore_result.json'))['social'];print(f\"\n> 🐾 与同仓灵兽的「{s['relation']}」之遇——这正是它的第一段社交记忆。\")")
          fi

          gh issue comment $ISSUE -R leonezhu/rebase -b "## 🌫️ ${HEADER} · ${NAME}

          ${STORY}
          ${SOCIAL_TAIL}
          ---

          **入账**：灵石 ${STONES} · 功力 ${EXP} · 余额 ${BAL} 灵石

          今日还可探索 $((3 - ${{ steps.beast.outputs.today }} - 1)) 次 · 评论 \`/explore\` 再入秘境"

      - name: 灵石入账（bot commit + 自动合并）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OWNER="${{ steps.beast.outputs.explorer }}"
          STONES=$(python3 -c "import json;print(json.load(open('explore_result.json'))['stones'])")
          EXP=$(python3 -c "import json;print(json.load(open('explore_result.json'))['exp'])")
          CODE=$(python3 -c "import json;print(json.load(open('explore_result.json'))['code'])")
          SOCIAL=$(python3 -c "import json;print('social' if json.load(open('explore_result.json')).get('social') else 'plain')")

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="explore-log/${OWNER}-${{ github.event.comment.id }}"
          git checkout -b "$BRANCH"
          git add "monsters/$OWNER/beast.yaml"
          if [ "$SOCIAL" = "social" ]; then
            git add world/social_log.yaml
          fi
          git commit -m "秘境探索($CODE): $OWNER ${STONES:+灵石$STONES}${EXP:+功力$EXP}"
          # 入账链咽喉点：push/create/merge 失败必须显式红灯（禁 || true 吞错），见 ITERATION.md 打磨轮登记
          git push origin "$BRANCH"
          gh pr create -R leonezhu/rebase --head "$BRANCH" --base main \
            -t "秘境探索入账 · $OWNER (#${{ github.event.issue.number }})" -b "bot 结算，自动合并"
          gh pr edit "$BRANCH" -R leonezhu/rebase --add-label "game/bot" || true
          gh pr merge "$BRANCH" --merge
