name: Register Beast (缔约仪式)
# 触发：register/* 分支的 PR
# 校验 beast.yaml 符合 schema → auto-merge → bot 开 issue 贴降世故事

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  register:
    # 只处理 register/* 分支
    if: startsWith(github.head_ref, 'register/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 校验变更范围（只许新增 monsters/<owner>/beast.yaml）
        id: scope
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          FILES=$(git diff --name-only $BASE $HEAD)
          echo "changed: $FILES"
          FAIL=0
          for f in $FILES; do
            case "$f" in
              monsters/*/beast.yaml) ;;  # 允许
              *) echo "::error::非法路径变更: $f（只允许 monsters/<owner>/beast.yaml）"; FAIL=1 ;;
            esac
          done
          # 只许新增文件，不许改已存在的
          for f in $FILES; do
            if git cat-file -e $BASE:$f 2>/dev/null; then
              echo "::error::已存在的灵籍不可修改: $f"; FAIL=1
            fi
          done
          echo "fail=$FAIL" >> $GITHUB_OUTPUT
          exit $FAIL

      - name: 校验 YAML + Schema
        run: |
          pip install jsonschema pyyaml --quiet
          python3 - <<'EOF'
          import yaml, json, sys
          from jsonschema import validate
          from pathlib import Path

          schema = json.load(open('schemas/beast.schema.json'))
          # 找 PR 中新增的 beast.yaml
          import subprocess
          base, head = "${{ github.event.pull_request.base.sha }}", "${{ github.event.pull_request.head.sha }}"
          files = subprocess.run(['git','diff','--name-only',base,head],capture_output=True,text=True).stdout.split()
          ok = True
          for f in files:
              if not f.endswith('beast.yaml'): continue
              data = yaml.safe_load(Path(f).read_text(encoding='utf-8'))
              # owner 必须匹配路径
              owner_in_path = f.split('/')[1]
              if data.get('owner') != owner_in_path:
                  print(f"::error::{f}: owner ({data.get('owner')}) 与路径 ({owner_in_path}) 不一致")
                  ok = False
                  continue
              try:
                  validate(data, schema)
                  print(f"✓ {f} 校验通过 ({data['name']} 五行-{data['element']})")
              except Exception as e:
                  print(f"::error::{f} 校验失败: {e}")
                  ok = False
          sys.exit(0 if ok else 1)
          EOF

      - name: 生成降世故事 + 合并
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.head_ref }}
        run: |
          # 提取怪兽信息（python yaml 解析，避免 awk/grep 对多行值不健壮）
          BEAST_FILE=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} | grep beast.yaml | head -1)
          python3 - "$BEAST_FILE" "$GITHUB_ENV" <<'EOF'
          import yaml, sys, pathlib

          data = yaml.safe_load(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          el_map = {'metal': '金', 'wood': '木', 'earth': '土', 'water': '水', 'fire': '火'}

          body = "## 缔约成立\n\n"
          body += f"**{data['name']}** 已入灵籍，成为 @{data['owner']} 的本命灵兽。\n\n"
          body += "### 降世故事\n\n"
          body += data['origin'].strip() + "\n"
          if data.get('mystery'):
              body += "\n> " + data['mystery'].strip() + "\n"
          body += "\n---\n\n"
          body += "🎮 指令：评论 `/battle @对方驯兽师` 发起斗法 · `/explore` 探索秘境\n"

          pathlib.Path('/tmp/issue_body.md').write_text(body, encoding='utf-8')
          # 多行安全写法：heredoc 定界符写入 GITHUB_ENV
          env = pathlib.Path(sys.argv[2]).open('a', encoding='utf-8')
          env.write(f"BEAST_NAME<<EOF_BEAST\n{data['name']}\nEOF_BEAST\n")
          env.write(f"BEAST_EL<<EOF_BEAST\n{el_map.get(data['element'], '?')}\nEOF_BEAST\n")
          env.close()
          print(f"✓ 提取成功: {data['name']} ({data['element']})")
          EOF

          MERGE_RESPONSE=$(gh pr merge $PR --merge --subject "缔约完成：${BEAST_NAME} 降世" 2>&1) || true

          # 开降世 issue（body 走文件，多行内容安全）
          gh issue create -R leonezhu/rebase \
            -t "📜 降世 · ${BEAST_NAME}（${BEAST_EL}）" \
            -b "$(cat /tmp/issue_body.md)" || true
