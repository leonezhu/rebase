name: Coordinate (旧分支坐标探测)
# T2-3 重逢伏笔：化神+ 灵兽在任意 issue 评论 /coordinate 触发探测
# 全服共享进度：每兽每日 1 次（50 灵石/次），全服每 20 次探测按序揭示一枚碎片（共 7 枚）
# 状态：world/coordinates.yaml（bot 独占写入，schema 硬边界见 schemas/coordinates.schema.json）
# 叙事：碎片文本预作于 lore/coordinates.yaml，本 workflow 只按序揭示，不生成不改写

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: coordinate
  cancel-in-progress: false

jobs:
  coordinate:
    if: startsWith(github.event.comment.body, '/coordinate')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 探测资格（灵籍存在 + 化神+ + 当日未测 + 灵石充足）+ 结算
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          pip install pyyaml --quiet
          RESULT=$(python3 - <<'PYEOF'
          import yaml, json, datetime
          from pathlib import Path

          OWNER = "${{ github.event.comment.user.login }}"
          TODAY = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=8))).strftime('%Y-%m-%d')
          F = f'monsters/{OWNER}/beast.yaml'

          def reject(msg):
              print(json.dumps({'ok': False, 'msg': msg}, ensure_ascii=False)); raise SystemExit

          if not Path(F).exists():
              reject(f'@{OWNER} 你尚未缔约，旧分支的雾不识你的气息。先去 README 缔约领养一只灵兽吧。')
          d = yaml.safe_load(Path(F).read_text(encoding='utf-8'))
          realm = d.get('realm', 'lianqi')
          ORDER = ['lianqi', 'zhuji', 'jindan', 'yuanying', 'huashen', 'dujie', 'dacheng']
          REALM_CN = {'lianqi': '炼气', 'zhuji': '筑基', 'jindan': '金丹', 'yuanying': '元婴',
                      'huashen': '化神', 'dujie': '渡劫', 'dacheng': '大乘'}
          if ORDER.index(realm) < ORDER.index('huashen'):
              reject(f'@{OWNER} {d["name"]} 尚在{REALM_CN[realm]}——旧分支的坐标太远，化神之后神识方能触到那片雾。')
          if d.get('spirit_stones', 0) < 50:
              reject(f'@{OWNER} 探测需 50 灵石凝神，{d["name"]} 囊中仅 {d.get("spirit_stones", 0)}。去秘境多走走。')

          W = Path('world/coordinates.yaml')
          if W.exists():
              w = yaml.safe_load(W.read_text(encoding='utf-8')) or {}
          else:
              w = {}
          w.setdefault('total_fragments', 7)
          w.setdefault('probes_required_per_fragment', 20)
          w.setdefault('probe_count', 0)
          w.setdefault('unlocked', 0)
          w.setdefault('fragments', ['【未测得】'] * 7)
          w.setdefault('probe_log', [])
          w.setdefault('updated_at', '')

          log = [e for e in w['probe_log'] if e.get('owner') == OWNER and e.get('date') == TODAY]
          if log:
              reject(f'@{OWNER} {d["name"]} 今日已凝神探测过一次——神识过耗则伤根，明日再来（每兽每日限 1 次）。全服今日又近一步。')

          # 结算：扣灵石 + 计数 + 可能揭示
          d['spirit_stones'] -= 50
          yaml.safe_dump(d, open(F, 'w', encoding='utf-8'), allow_unicode=True, sort_keys=False)
          w['probe_count'] += 1
          w['probe_log'].append({'owner': OWNER, 'date': TODAY})
          w['updated_at'] = datetime.datetime.now(datetime.timezone.utc).isoformat()

          need = w['probes_required_per_fragment']
          newly = None
          if w['probe_count'] % need == 0 and w['unlocked'] < 7:
              idx = w['unlocked']
              lore = yaml.safe_load(open('lore/coordinates.yaml', encoding='utf-8'))
              frag = lore['fragments'][idx]
              w['fragments'][idx] = str(frag)
              w['unlocked'] = idx + 1
              newly = idx + 1

          # schema 硬边界自校验（bot 写入也必须过自己的 schema）
          import jsonschema
          schema = json.loads(Path('schemas/coordinates.schema.json').read_text(encoding='utf-8'))
          jsonschema.validate(w, schema)

          yaml.safe_dump(w, W.open('w', encoding='utf-8'), allow_unicode=True, sort_keys=False)
          frags = [f for f in w['fragments'] if f != '【未测得】']
          print(json.dumps({
              'ok': True, 'name': d['name'], 'realm_cn': REALM_CN[realm],
              'probe_count': w['probe_count'], 'unlocked': w['unlocked'],
              'newly': newly, 'newly_text': (w['fragments'][newly - 1] if newly else ''),
              'to_next': need - (w['probe_count'] % need if w['unlocked'] < 7 else 0),
              'known_frags': frags, 'balance': d['spirit_stones'],
          }, ensure_ascii=False))
          PYEOF
          )
          echo "$RESULT" > coordinate_result.json
          OK=$(python3 -c "import json;print(json.load(open('coordinate_result.json'))['ok'])")
          if [ "$OK" != "True" ]; then
            MSG=$(python3 -c "import json;print(json.load(open('coordinate_result.json'))['msg'])")
            gh issue comment $ISSUE -R leonezhu/rebase -b "$MSG"
            exit 1
          fi

      - name: bot 贴探测结果
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          python3 - <<'PYEOF'
          import json, subprocess
          d = json.load(open('coordinate_result.json'))
          newly_block = ''
          if d['newly']:
              newly_block = f"""

          ## 🧭 第 {d['newly']} 枚碎片显形了——

          > {d['newly_text']}

          *旧分支的雾，又薄了一层。*"""
          known = '\n\n'.join(f"**{i+1}** · {t}" for i, t in enumerate(d['known_frags']))
          body = f"""## 🧭 旧分支坐标 · 探测

          > {d['name']}（{d['realm_cn']}）敛息凝神，神识越过雾墙——旧世界残影的方位，又清晰了一分。

          **全服探测进度**：第 {d['probe_count']} 次 · 已显形 {d['unlocked']}/7 枚 · 距下一枚还需 {d['to_next']} 次探测
          灵石 -50，余额 {d['balance']}。{newly_block}

          ---

          <details><summary>已显形的碎片（全服共有）</summary>

          {known if known else '（尚无碎片显形）'}

          </details>

          *化神+ 的灵兽每日可探测一次（/coordinate，50 灵石）——每一次探测，都是全服向重逢走近一步。*"""
          subprocess.run(['gh', 'issue', 'comment', str(${{ github.event.issue.number }}),
                          '-R', 'leonezhu/rebase', '-b', body], check=True)
          PYEOF

      - name: 入账（bot commit + 自动合并）
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OWNER="${{ github.event.comment.user.login }}"
          ISSUE="${{ github.event.issue.number }}"
          UNLOCKED=$(python3 -c "import json;print(json.load(open('coordinate_result.json'))['unlocked'])")
          PROBES=$(python3 -c "import json;print(json.load(open('coordinate_result.json'))['probe_count'])")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="coordinate-log/$OWNER-$(date +%s)"
          git checkout -b "$BRANCH"
          git add "monsters/$OWNER/beast.yaml" world/coordinates.yaml
          git commit -m "旧分支坐标($PROBES次/显形$UNLOCKED枚): $OWNER 探测入账"
          # 入账链咽喉点：push/create/merge 失败必须显式红灯（禁 || true 吞错）
          git push origin "$BRANCH"
          gh pr create -R leonezhu/rebase --head "$BRANCH" --base main \
            -t "🧭 坐标探测入账 #$ISSUE" -b "bot 结算，自动合并"
          gh pr edit "$BRANCH" -R leonezhu/rebase --add-label "game/bot" || true
          gh pr merge "$BRANCH" --merge
