# Pages 部署: push main → 构建斗法志索引 → 部署整个仓库为静态站
# 线上入口: / (图鉴缓存) → /battle-chronicle.html (斗法志回放)
name: Pages Deploy
on:
  push:
    branches: [main]
    paths:
      - 'chronicle-index.json'
      - 'index.html'
      - 'codex.html'
      - 'world-page.html'
      - 'world/index.json'
      - 'tales/*.html'
      - 'tales/*.md'
      - 'tales-list.html'
      - '404.html'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: write  # 构建世界资产索引步需 push main（world/index.json 重铸），pages/id-token 仅供部署
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - name: 构建斗法志索引
        run: python3 scripts/build-chronicle-index.py
      # world/index.json 自动重铸（tales 字段随 tales/*.md 刷新，传记目录页数据源）
      - name: 构建世界资产索引
        run: |
          python3 scripts/build-world-index.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add world/index.json
          git diff --cached --quiet || git commit -m "world: 世界资产索引重铸(world/index.json)"
          # 并发保险：push 竞速退避重试, 至多 3 次
          for i in 1 2 3; do
            git pull --rebase origin main || git rebase --abort || true
            if git push origin main; then
              echo "push OK (第 $i 次)"; break
            fi
            echo "push 被拒(第 $i 次), 5s 后重试…"
            sleep 5
            [ "$i" = 3 ] && echo "::warning::索引 3 次推送均被拒, 下次触发会重铸" && exit 1
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
