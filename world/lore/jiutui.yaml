id: lore-jiutui
name: 旧蜕
kind: lore
desc: |
  大变基是一次蜕皮。旧世界的"你"被留在原地，新世界的你从蜕里爬出来。
  旧蜕=蜕皮时剥落的一缕前识：没有形体，一点青苔色的微光，栖在旧物里——
  钟壁的苔、浅湖的水汽、烤鱼摊的炭火余烬，皆可寄身。
  它认得你的形状，却忘了自己的名字。说话极省——每个字都是从旧世界带来的行李。
  玩家醒时身边那缕光，是他自己的旧蜕。它不是向导，是你留在原地的部分。
threads:
  - 旧蜕为何认得你却忘了自己——它在旧世界是你的什么？
  - 境界越高，旧蜕能说的话越多？（感灵清晰度与旧蜕的"记起"同步）
  - 烤鱼老头是否也有旧蜕相随——他是不是也在等谁回来？
first_seen: leonezhu-雄大 · 大变基第九日
status: watching-fire
closure: |
  雄大兵解之夜，旧蜕一路点亮青苔相送，受遗命「替我看着火」。
  现栖于巨钟谷地钟壁。起雾的夜里谷地会亮起一点青色——是它还在看火。
